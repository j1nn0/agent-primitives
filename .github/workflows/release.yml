          node --input-type=module <<'NODE'
          import { judgeProgress, ProgressError } from '@j1nn0/agent-progress';
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          assert(typeof ProgressError === 'function', 'installed ProgressError export is not a constructor');
          const first = judgeProgress({ current: { milestones: ['planned'] } });
          assert(first.outcome === 'unknown', 'registry progress judgment was not unknown');
          assert(first.reason === 'missing_baseline', 'registry progress judgment had the wrong unknown reason');
          const progress = judgeProgress({
            previous: { milestones: first.recordedMilestones },
            current: { milestones: ['planned', 'published'] },
          });
          assert(progress.outcome === 'progress', 'registry progress judgment did not report progress');
          assert(
            JSON.stringify(progress.newMilestones) === JSON.stringify(['published']),
            'registry progress judgment returned the wrong new milestone',
          );

          const adapter = await import('@j1nn0/agent-progress-pi');

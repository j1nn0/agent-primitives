          import { createHandoff, HandoffError } from '@j1nn0/agent-handoff';
          import { deepStrictEqual } from 'node:assert/strict';
          import { accessSync } from 'node:fs';
          import { readFile } from 'node:fs/promises';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          const identity = createHandoff({
            schemaVersion: 1,
            id: 'ship-it',
            source: 'release-smoke',
            goal: 'Ship the public release safely.',
          });
          assert(
            identity.schemaVersion === 1 &&
              identity.id === 'ship-it' &&
              identity.source === 'release-smoke' &&
              identity.goal === 'Ship the public release safely.',
            'core identity was not preserved',
          );

          const constraints = ['verify-core', 'verify-core'];
          const openItems = ['await-ci', 'await-ci'];
          const prose = createHandoff({
            schemaVersion: 1,
            id: 'prose-duplicates',
            source: 'release-smoke',
            goal: 'Preserve caller prose.',
            constraints,
            openItems,
          });
          deepStrictEqual(prose.constraints, constraints);
          deepStrictEqual(prose.openItems, openItems);

          let duplicateError;
          try {
            createHandoff({
              schemaVersion: 1,
              id: 'duplicate-evidence',
              source: 'release-smoke',
              goal: 'Reject duplicate evidence references.',
              evidenceReferences: ['ev-dup', 'ev-dup'],
            });
          } catch (error) {
            duplicateError = error;
          }
          assert(
            duplicateError instanceof HandoffError &&
              duplicateError.name === 'HandoffError' &&
              duplicateError.code === 'invalid_input' &&
              duplicateError.message === 'Invalid handoff input.',
            'duplicate evidence references did not throw the expected HandoffError shape',
          );

          const adapterModule = await import('@j1nn0/agent-handoff-pi');
          const adapterDefault = adapterModule.default;
          assert(typeof adapterDefault === 'function', 'Pi adapter default export is not a function');

          const createShim = (seed = []) => {
            const handlers = new Map();
            const commands = new Map();
            const tools = [];
            const branch = structuredClone(seed);
            const api = {
              on: (event, handler) => handlers.set(event, handler),
              registerCommand: (name, def) => commands.set(name, def),
              registerTool: (def) => tools.push(def),
              appendEntry: (customType, data) => branch.push({ type: 'custom', customType, data }),
            };
            adapterDefault(api);
            return { handlers, commands, tools, branch };
          };

          const joinedText = (result) =>
            result.content
              .filter((content) => content.type === 'text')
              .map((content) => content.text)
              .join('');

          const findTool = (shim, name) => {
            const tool = shim.tools.find((candidate) => candidate.name === name);
            assert(tool !== undefined, 'expected Handoff tool was not registered');
            return tool;
          };

          const first = createShim();
          const ctx = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => first.branch },
          };
          const toolNames = first.tools.map((tool) => tool.name).sort();
          deepStrictEqual(toolNames, ['agent_handoff_create', 'agent_handoff_get', 'agent_handoff_remove']);

          const createTool = findTool(first, 'agent_handoff_create');
          const getTool = findTool(first, 'agent_handoff_get');
          const handoffPacket = {
            schemaVersion: 1,
            id: 'ship-it',
            source: 'release-smoke',
            goal: 'Ship the public release safely.',
          };
          const created = await createTool.execute('smoke-create', handoffPacket, undefined, undefined, ctx);
          assert(joinedText(created).includes('created packet "ship-it"'), 'Handoff create tool did not create the packet');
          const persisted = first.branch.find((entry) => entry.customType === 'agent-handoff-state');
          assert(
            persisted?.data &&
              Array.isArray(persisted.data.packets) &&
              persisted.data.packets.some((packet) => packet.id === 'ship-it'),
            'Handoff state entry did not persist ship-it',
          );

          const listed = await getTool.execute('smoke-get', {}, undefined, undefined, ctx);
          assert(joinedText(listed).includes('ship-it'), 'Handoff get tool did not list ship-it');

          const duplicate = await createTool.execute('smoke-duplicate', handoffPacket, undefined, undefined, ctx);
          assert(
            joinedText(duplicate).includes('duplicate packet id "ship-it"'),
            'Handoff duplicate create did not return the duplicate message',
          );

          const second = createShim(first.branch);
          const ctx2 = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => second.branch },
          };
          const sessionStart = second.handlers.get('session_start');
          assert(typeof sessionStart === 'function', 'Handoff session_start handler was not registered');
          await sessionStart({ type: 'session_start' }, ctx2);
          const resumed = await findTool(second, 'agent_handoff_get').execute(
            'smoke-resume',
            {},
            undefined,
            undefined,
            ctx2,
          );
          assert(joinedText(resumed).includes('ship-it'), 'Handoff resume did not restore ship-it');

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-handoff-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const extensions = adapterManifest.pi?.extensions;
          assert(Array.isArray(extensions) && extensions.length > 0, 'pi.extensions is missing');
          for (const target of extensions) {
            accessSync(new URL(target, adapterManifestUrl));
          }
          const dependency = adapterManifest.dependencies?.['@j1nn0/agent-handoff'];
          assert(
            dependency === `^${process.env.CORE_VERSION}`,
            'packed adapter does not depend on the expected core version',
          );
          const dependencyText = JSON.stringify(adapterManifest.dependencies ?? {});
          assert(
            !/(?:workspace:|file:|link:)/.test(dependencyText),
            'packed adapter dependencies contain workspace:, file:, or link:',
          );
          console.log('Handoff packed artifact consumer smoke passed.');
          NODE

      - name: Smoke-test Budget packed artifacts in a fresh consumer
        if: ${{ steps.validate_reuse.outputs.reuse != 'true' && inputs.family == 'agent-budget' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          consumer_dir="$RUNNER_TEMP/release-consumer"
          core_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$CORE_TARBALL_BASE-*.tgz" ! -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          pi_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          if [[ -z "$core_tarball" || -z "$pi_tarball" ]]; then
            echo "Could not locate both packed release tarballs for the consumer smoke test." >&2
            exit 1
          fi

          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$core_tarball" "$pi_tarball"
          node --input-type=module <<'NODE'
          import { judgeBudget, BudgetError } from '@j1nn0/agent-budget';
          import { deepStrictEqual } from 'node:assert/strict';
          import { accessSync } from 'node:fs';
          import { readFile } from 'node:fs/promises';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          const within = judgeBudget({ consumed: 39, limit: 40 });
          assert(
            within.outcome === 'within_budget' && within.remaining === 1,
            'within-budget verdict was incorrect',
          );
          const boundary = judgeBudget({ consumed: 40, limit: 40 });
          assert(
            boundary.outcome === 'exhausted' && boundary.remaining === 0,
            'inclusive boundary verdict was incorrect',
          );
          const overage = judgeBudget({ consumed: 41, limit: 40 });
          assert(
            overage.outcome === 'exhausted' && overage.remaining === -1,
            'negative overage verdict was incorrect',
          );
          const fractional = judgeBudget({ consumed: 12.483, limit: 20 });
          assert(
            fractional.outcome === 'within_budget' && Math.abs(fractional.remaining - 7.517) < 1e-9,
            'fractional verdict was incorrect',
          );
          const zeroLimit = judgeBudget({ consumed: 0, limit: 0 });
          assert(
            zeroLimit.outcome === 'exhausted' && zeroLimit.remaining === 0,
            'zero-limit verdict was incorrect',
          );

          let invalidError;
          try {
            judgeBudget({ consumed: 1, limit: 2, extra: true });
          } catch (error) {
            invalidError = error;
          }
          assert(
            invalidError instanceof BudgetError &&
              invalidError.name === 'BudgetError' &&
              invalidError.code === 'invalid_input' &&
              invalidError.message === 'Invalid budget input.',
            'invalid input did not throw the expected BudgetError shape',
          );

          const adapterModule = await import('@j1nn0/agent-budget-pi');
          assert(typeof adapterModule.default === 'function', 'Pi adapter default export is not a function');

          const createShim = (seed = []) => {
            const handlers = new Map();
            const commands = new Map();
            const tools = [];
            const branch = structuredClone(seed);
            const api = {
              on: (event, handler) => handlers.set(event, handler),
              registerCommand: (name, def) => commands.set(name, def),
              registerTool: (def) => tools.push(def),
              appendEntry: (customType, data) => branch.push({ type: 'custom', customType, data }),
            };
            adapterModule.default(api);
            return { handlers, commands, tools, branch };
          };

          const joinedText = (result) =>
            result.content
              .filter((content) => content.type === 'text')
              .map((content) => content.text)
              .join('');
          const findTool = (shim, name) => {
            const tool = shim.tools.find((candidate) => candidate.name === name);
            assert(tool !== undefined, `expected Budget tool was not registered: ${name}`);
            return tool;
          };

          const first = createShim();
          const ctx = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => first.branch },
          };
          const toolNames = first.tools.map((tool) => tool.name).sort();
          deepStrictEqual(
            toolNames,
            ['agent_budget_get', 'agent_budget_judge', 'agent_budget_remove', 'agent_budget_set'],
          );

          const setTool = findTool(first, 'agent_budget_set');
          const getTool = findTool(first, 'agent_budget_get');
          const judgeTool = findTool(first, 'agent_budget_judge');
          const firstBudget = { id: 'first', consumed: 5, limit: 10 };
          const secondBudget = { id: 'second', consumed: 3, limit: 8 };
          const createdFirst = await setTool.execute('smoke-first', firstBudget, undefined, undefined, ctx);
          assert(joinedText(createdFirst).includes('created budget "first"'), 'first Budget set did not create the record');
          const createdSecond = await setTool.execute('smoke-second', secondBudget, undefined, undefined, ctx);
          assert(joinedText(createdSecond).includes('created budget "second"'), 'second Budget set did not create the record');
          const stateEntries = () => first.branch.filter((entry) => entry.customType === 'agent-budget-state');
          const persisted = stateEntries().at(-1);
          assert(
            persisted?.data && Array.isArray(persisted.data.budgets),
            'Budget state entry did not persist both records',
          );
          deepStrictEqual(persisted.data.budgets, [firstBudget, secondBudget]);

          const replaced = await setTool.execute(
            'smoke-replace',
            { id: 'first', consumed: 6, limit: 10 },
            undefined,
            undefined,
            ctx,
          );
          assert(joinedText(replaced).includes('replaced budget "first"'), 'Budget replacement message was missing');
          assert(joinedText(replaced).includes('in place'), 'Budget replacement was not reported as in place');
          const replacedState = stateEntries().at(-1)?.data;
          assert(replacedState && Array.isArray(replacedState.budgets), 'replaced Budget state was not persisted');
          assert(
            replacedState.budgets.length === 2 &&
              replacedState.budgets[0]?.id === 'first' &&
              replacedState.budgets[0]?.consumed === 6 &&
              replacedState.budgets[1]?.id === 'second',
            'Budget replacement did not preserve order',
          );

          const stateEntryCount = stateEntries().length;
          const unchanged = await setTool.execute(
            'smoke-unchanged',
            { id: 'first', consumed: 6, limit: 10 },
            undefined,
            undefined,
            ctx,
          );
          assert(joinedText(unchanged).includes('unchanged'), 'unchanged Budget message was missing');
          assert(joinedText(unchanged).includes('nothing was written'), 'unchanged Budget was reported as written');
          assert(stateEntries().length === stateEntryCount, 'unchanged Budget set appended a state entry');

          const beforeJudge = stateEntries().length;
          const judged = await judgeTool.execute('smoke-judge', {}, undefined, undefined, ctx);
          assert(joinedText(judged).includes('- first: within_budget (remaining 4)'), 'Budget judge omitted first verdict');
          assert(joinedText(judged).includes('- second: within_budget (remaining 5)'), 'Budget judge omitted second verdict');
          assert(stateEntries().length === beforeJudge, 'Budget judge appended a state entry');

          const listed = await getTool.execute('smoke-get', {}, undefined, undefined, ctx);
          const listedText = joinedText(listed);
          assert(listedText.indexOf('first') < listedText.indexOf('second'), 'Budget get did not preserve insertion order');

          const second = createShim(first.branch);
          const ctx2 = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => second.branch },
          };
          const sessionStart = second.handlers.get('session_start');
          assert(typeof sessionStart === 'function', 'Budget session_start handler was not registered');
          await sessionStart({ type: 'session_start' }, ctx2);
          const resumed = await findTool(second, 'agent_budget_get').execute(
            'smoke-resume',
            {},
            undefined,
            undefined,
            ctx2,
          );
          const resumedText = joinedText(resumed);
          assert(resumedText.includes('first: consumed=6 limit=10'), 'Budget resume lost the replaced value');
          assert(resumedText.includes('second: consumed=3 limit=8'), 'Budget resume lost the second record');

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-budget-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const extensions = adapterManifest.pi?.extensions;
          assert(Array.isArray(extensions) && extensions.length > 0, 'pi.extensions is missing');
          for (const target of extensions) {
            accessSync(new URL(target, adapterManifestUrl));
          }
          const dependency = adapterManifest.dependencies?.['@j1nn0/agent-budget'];
          assert(
            dependency === `^${process.env.CORE_VERSION}`,
            'packed adapter does not depend on the expected core version',
          );
          const dependencyText = JSON.stringify(adapterManifest.dependencies ?? {});
          assert(
            !/(?:workspace:|file:|link:)/.test(dependencyText),
            'packed adapter dependencies contain workspace:, file:, or link:',
          );
          console.log('Budget packed artifact consumer smoke passed.');
          NODE

      - name: Smoke-test Tool Policy packed artifacts in a fresh consumer
        if: ${{ steps.validate_reuse.outputs.reuse != 'true' && inputs.family == 'agent-tool-policy' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          consumer_dir="$RUNNER_TEMP/release-consumer"
          core_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$CORE_TARBALL_BASE-*.tgz" ! -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          pi_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          if [[ -z "$core_tarball" || -z "$pi_tarball" ]]; then
            echo "Could not locate both packed release tarballs for the consumer smoke test." >&2
            exit 1
          fi

          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$core_tarball" "$pi_tarball"
          node --input-type=module <<'NODE'
          import { judgeToolPolicy, ToolPolicyError } from '@j1nn0/agent-tool-policy';
          import { deepStrictEqual } from 'node:assert/strict';
          import { accessSync } from 'node:fs';
          import { readFile } from 'node:fs/promises';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          deepStrictEqual(
            judgeToolPolicy({
              tool: 'read',
              policy: { default: 'deny', allow: ['read'], deny: [] },
            }),
            { outcome: 'allowed', source: 'rule' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'bash',
              policy: { default: 'allow', allow: [], deny: ['bash'] },
            }),
            { outcome: 'denied', source: 'rule' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'edit',
              policy: { default: 'deny', allow: [], deny: [], requiresApproval: ['edit'] },
            }),
            { outcome: 'requires_approval', source: 'rule' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'write',
              policy: { default: 'allow', allow: [], deny: [] },
            }),
            { outcome: 'allowed', source: 'default' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'write',
              policy: { default: 'deny', allow: [], deny: [] },
            }),
            { outcome: 'denied', source: 'default' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'write',
              policy: { default: 'requires_approval', allow: [], deny: [] },
            }),
            { outcome: 'requires_approval', source: 'default' },
          );

          let invalidError;
          try {
            judgeToolPolicy({ tool: 'bash' });
          } catch (error) {
            invalidError = error;
          }
          assert(
            invalidError instanceof ToolPolicyError &&
              invalidError.name === 'ToolPolicyError' &&
              invalidError.code === 'invalid_input' &&
              invalidError.message === 'Invalid tool policy input.',
            'invalid input did not throw the expected ToolPolicyError shape',
          );

          let overlapError;
          try {
            judgeToolPolicy({
              tool: 'tool',
              policy: { default: 'deny', allow: ['tool'], deny: ['tool'] },
            });
          } catch (error) {
            overlapError = error;
          }
          assert(
            overlapError instanceof ToolPolicyError &&
              overlapError.name === 'ToolPolicyError' &&
              overlapError.code === 'invalid_input' &&
              overlapError.message === 'Invalid tool policy input.',
            'cross-list overlap did not throw the expected ToolPolicyError shape',
          );

          const adapterModule = await import('@j1nn0/agent-tool-policy-pi');
          const adapterDefault = adapterModule.default;
          assert(typeof adapterDefault === 'function', 'Pi adapter default export is not a function');

          const createShim = (seed = []) => {
            const handlers = new Map();
            const commands = new Map();
            const tools = [];
            const branch = structuredClone(seed);
            const api = {
              on: (event, handler) => handlers.set(event, handler),
              registerCommand: (name, def) => commands.set(name, def),
              registerTool: (def) => tools.push(def),
              appendEntry: (customType, data) => branch.push({ type: 'custom', customType, data }),
            };
            adapterDefault(api);
            return { handlers, commands, tools, branch };
          };

          const joinedText = (result) =>
            result.content
              .filter((content) => content.type === 'text')
              .map((content) => content.text)
              .join('');

          const first = createShim();
          const ctx = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => first.branch },
          };
          assert(first.commands.has('agent-tool-policy'), 'agent-tool-policy command was not registered');
          deepStrictEqual(first.tools, []);

          const toolCall = first.handlers.get('tool_call');
          assert(typeof toolCall === 'function', 'tool_call handler was not registered');
          const sessionStart = first.handlers.get('session_start');
          assert(typeof sessionStart === 'function', 'session_start handler was not registered');

          const unconfigured = await toolCall(
            { type: 'tool_call', toolName: 'read', toolCallId: 's1', input: {} },
            ctx,
          );
          assert(
            unconfigured?.block === true &&
              typeof unconfigured.reason === 'string' &&
              unconfigured.reason.includes('no policy configured'),
            'unconfigured tool call did not block with the expected reason',
          );

          first.branch.push({
            type: 'custom',
            customType: 'agent-tool-policy-state',
            data: { schemaVersion: 1, policy: { default: 'deny', allow: ['read'], deny: [] } },
          });
          await sessionStart({ type: 'session_start' }, ctx);
          assert(
            (await toolCall({ type: 'tool_call', toolName: 'read', toolCallId: 's2', input: {} }, ctx)) === undefined,
            'allowed tool call was blocked by the configured policy',
          );
          const denied = await toolCall(
            { type: 'tool_call', toolName: 'bash', toolCallId: 's3', input: {} },
            ctx,
          );
          assert(
            denied?.block === true &&
              typeof denied.reason === 'string' &&
              denied.reason.includes('denied by tool policy'),
            'denied tool call did not block with the expected reason',
          );

          first.branch.push({
            type: 'custom',
            customType: 'agent-tool-policy-state',
            data: { schemaVersion: 1, policy: null },
          });
          await sessionStart({ type: 'session_start' }, ctx);
          assert(
            (await toolCall({ type: 'tool_call', toolName: 'bash', toolCallId: 's4', input: {} }, ctx)) === undefined,
            'explicitly disabled policy did not pass the tool call through',
          );

          first.branch.push({
            type: 'custom',
            customType: 'agent-tool-policy-state',
            data: { schemaVersion: 99, policy: 'garbage' },
          });
          await sessionStart({ type: 'session_start' }, ctx);
          const corrupt = await toolCall(
            { type: 'tool_call', toolName: 'read', toolCallId: 's5', input: {} },
            ctx,
          );
          assert(
            corrupt?.block === true &&
              typeof corrupt.reason === 'string' &&
              corrupt.reason.includes('policy configuration'),
            'corrupt newest policy did not block with a configuration reason',
          );

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-tool-policy-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const dependency = adapterManifest.dependencies?.['@j1nn0/agent-tool-policy'];
          assert(
            dependency === `^${process.env.CORE_VERSION}`,
            'packed adapter does not depend on the expected core version',
          );
          const dependencyText = JSON.stringify(adapterManifest.dependencies ?? {});
          assert(
            !/(?:workspace:|file:|link:)/.test(dependencyText),
            'packed adapter dependencies contain workspace:, file:, or link:',
          );
          const extensions = adapterManifest.pi?.extensions;
          assert(Array.isArray(extensions) && extensions.length > 0, 'pi.extensions is missing');
          for (const target of extensions) {
            accessSync(new URL(target, adapterManifestUrl));
          }
          console.log('Tool Policy packed artifact consumer smoke passed.');
          NODE


      - name: Upload validated release tarballs
        if: ${{ inputs.mode == 'validate' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs-${{ inputs.family }}-${{ inputs.core_version }}-${{ inputs.pi_version }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.validate_artifacts.outputs.core_tarball }}
            ${{ steps.validate_artifacts.outputs.pi_tarball }}
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false
  publish:
    permissions:
      actions: read
      contents: read
      id-token: write
    if: ${{ inputs.mode == 'publish' }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      CORE_PKG_NAME: ${{ inputs.family == 'agent-tool-policy' && '@j1nn0/agent-tool-policy' || inputs.family == 'agent-budget' && '@j1nn0/agent-budget' || inputs.family == 'agent-handoff' && '@j1nn0/agent-handoff' || inputs.family == 'agent-evidence' && '@j1nn0/agent-evidence' || inputs.family == 'agent-retry-guard' && '@j1nn0/agent-retry-guard' || inputs.family == 'agent-progress' && '@j1nn0/agent-progress' || inputs.family == 'agent-state' && '@j1nn0/agent-state' || '@j1nn0/agent-context-guard' }}
      ADAPTER_PKG_NAME: ${{ inputs.family == 'agent-tool-policy' && '@j1nn0/agent-tool-policy-pi' || inputs.family == 'agent-budget' && '@j1nn0/agent-budget-pi' || inputs.family == 'agent-handoff' && '@j1nn0/agent-handoff-pi' || inputs.family == 'agent-evidence' && '@j1nn0/agent-evidence-pi' || inputs.family == 'agent-retry-guard' && '@j1nn0/agent-retry-guard-pi' || inputs.family == 'agent-progress' && '@j1nn0/agent-progress-pi' || inputs.family == 'agent-state' && '@j1nn0/agent-state-pi' || '@j1nn0/agent-context-guard-pi' }}
      CORE_PKG_DIR: ${{ inputs.family == 'agent-tool-policy' && 'packages/agent-tool-policy' || inputs.family == 'agent-budget' && 'packages/agent-budget' || inputs.family == 'agent-handoff' && 'packages/agent-handoff' || inputs.family == 'agent-evidence' && 'packages/agent-evidence' || inputs.family == 'agent-retry-guard' && 'packages/agent-retry-guard' || inputs.family == 'agent-progress' && 'packages/agent-progress' || inputs.family == 'agent-state' && 'packages/agent-state' || 'packages/context-guard' }}
      ADAPTER_PKG_DIR: ${{ inputs.family == 'agent-tool-policy' && 'packages/agent-tool-policy-pi' || inputs.family == 'agent-budget' && 'packages/agent-budget-pi' || inputs.family == 'agent-handoff' && 'packages/agent-handoff-pi' || inputs.family == 'agent-evidence' && 'packages/agent-evidence-pi' || inputs.family == 'agent-retry-guard' && 'packages/agent-retry-guard-pi' || inputs.family == 'agent-progress' && 'packages/agent-progress-pi' || inputs.family == 'agent-state' && 'packages/agent-state-pi' || 'packages/context-guard-pi' }}
      CORE_TARBALL_BASE: ${{ inputs.family == 'agent-tool-policy' && 'j1nn0-agent-tool-policy' || inputs.family == 'agent-budget' && 'j1nn0-agent-budget' || inputs.family == 'agent-handoff' && 'j1nn0-agent-handoff' || inputs.family == 'agent-evidence' && 'j1nn0-agent-evidence' || inputs.family == 'agent-retry-guard' && 'j1nn0-agent-retry-guard' || inputs.family == 'agent-progress' && 'j1nn0-agent-progress' || inputs.family == 'agent-state' && 'j1nn0-agent-state' || 'j1nn0-agent-context-guard' }}
      ADAPTER_TARBALL_BASE: ${{ inputs.family == 'agent-tool-policy' && 'j1nn0-agent-tool-policy-pi' || inputs.family == 'agent-budget' && 'j1nn0-agent-budget-pi' || inputs.family == 'agent-handoff' && 'j1nn0-agent-handoff-pi' || inputs.family == 'agent-evidence' && 'j1nn0-agent-evidence-pi' || inputs.family == 'agent-retry-guard' && 'j1nn0-agent-retry-guard-pi' || inputs.family == 'agent-progress' && 'j1nn0-agent-progress-pi' || inputs.family == 'agent-state' && 'j1nn0-agent-state-pi' || 'j1nn0-agent-context-guard-pi' }}
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard that the dispatch ref is main
        env:
          DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Release publishing is allowed only from refs/heads/main; got $DISPATCH_REF." >&2
            exit 1
          fi

      - name: Guard that main has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          checked_out_commit="$(git rev-parse HEAD)"
          remote_main_commit="$(git rev-parse origin/main)"
          if [[ "$checked_out_commit" != "$remote_main_commit" ]]; then
            echo "main advanced after dispatch; re-dispatch the release from the current main commit." >&2
            exit 1
          fi

      - name: Guard that the checkout is clean
        shell: bash
        run: |
          set -euo pipefail
          tree_status="$(git status --porcelain)"
          if [[ -n "$tree_status" ]]; then
            echo "The checked-out release tree is not clean:" >&2
            printf '%s\n' "$tree_status" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Re-assert manifest versions
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_core_version="$(node -p "JSON.parse(require('node:fs').readFileSync('$CORE_PKG_DIR/package.json', 'utf8')).version")"
          manifest_pi_version="$(node -p "JSON.parse(require('node:fs').readFileSync('$ADAPTER_PKG_DIR/package.json', 'utf8')).version")"
          if [[ "$CORE_VERSION" != "$manifest_core_version" ]]; then
            echo "core_version no longer matches the core manifest." >&2
            exit 1
          fi
          if [[ "$PI_VERSION" != "$manifest_pi_version" ]]; then
            echo "pi_version no longer matches the Pi adapter manifest." >&2
            exit 1
          fi

      - name: Resolve, download, and audit validated release artifacts
        id: validated_tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
          VALIDATED_RUN_ATTEMPT: ${{ needs.validate.outputs.validated_run_attempt }}
          DISPATCH_SHA: ${{ github.sha }}
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
          FAMILY: ${{ inputs.family }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VALIDATED_RUN_ID" =~ ^[0-9]{1,19}$ ]]; then
            echo "assertion: VALIDATED_RUN_ID must match ^[0-9]{1,19}$; run a new validate dispatch; failing closed." >&2
            exit 1
          fi
          if [[ ! "$VALIDATED_RUN_ATTEMPT" =~ ^[0-9]{1,9}$ ]]; then
            echo "assertion: VALIDATED_RUN_ATTEMPT must match ^[0-9]{1,9}$; run a new validate dispatch; failing closed." >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "assertion: DISPATCH_SHA must match ^[0-9a-f]{40}$; run a new validate dispatch; failing closed." >&2
            exit 1
          fi

          expected_artifact_name="release-tarballs-${FAMILY}-${CORE_VERSION}-${PI_VERSION}-${DISPATCH_SHA}-attempt-${VALIDATED_RUN_ATTEMPT}"
          artifacts_file="$RUNNER_TEMP/validated-release-artifacts.json"
          rm -f "$artifacts_file"
          artifacts_fetched=false
          for ((attempt=1; attempt<=3; attempt++)); do
            if gh api "repos/${REPOSITORY}/actions/runs/${VALIDATED_RUN_ID}/artifacts?per_page=100" > "$artifacts_file" 2>/dev/null; then
              artifacts_fetched=true
              break
            fi
            if (( attempt < 3 )); then
              sleep 5
            fi
          done
          if [[ "$artifacts_fetched" != true ]]; then
            echo "assertion: validated release artifact listing failed after 3 attempts; run a new validate dispatch; failing closed." >&2
            exit 1
          fi

          if ! artifact_metadata="$(python3 - "$artifacts_file" "$expected_artifact_name" "$VALIDATED_RUN_ID" "$DISPATCH_SHA" <<'PY'
          import json
          import re
          import sys

          def fail(assertion):
              print(f"assertion failed: {assertion}; failing closed.", file=sys.stderr)
              raise SystemExit(2)

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  data = json.load(handle)
          except (OSError, json.JSONDecodeError):
              fail("artifact list response is valid JSON")

          if not isinstance(data, dict):
              fail("artifact list response is a dict")
          total_count = data.get("total_count")
          artifacts = data.get("artifacts")
          if not isinstance(total_count, int) or isinstance(total_count, bool):
              fail("total_count has an integer type")
          if not isinstance(artifacts, list) or any(not isinstance(artifact, dict) for artifact in artifacts):
              fail("artifacts is a list of artifact dictionaries")
          if not (total_count == len(artifacts)):
              fail("total_count == len(artifacts)")

          expected_name = sys.argv[2]
          matches = [artifact for artifact in artifacts if artifact.get("name") == expected_name]
          if len(matches) != 1:
              fail("exactly one artifact has the expected attempt-specific name")
          artifact = matches[0]
          required_fields = {"id", "name", "expired", "digest", "size_in_bytes", "workflow_run"}
          if any(field not in artifact for field in required_fields):
              fail("artifact contains all required fields")
          if not isinstance(artifact["id"], int) or isinstance(artifact["id"], bool):
              fail("artifact id has an integer type")
          if not isinstance(artifact["name"], str):
              fail("artifact name has a string type")
          if not isinstance(artifact["expired"], bool):
              fail("artifact expired has a boolean type")
          if not isinstance(artifact["digest"], str):
              fail("artifact digest has a string type")
          if not isinstance(artifact["size_in_bytes"], int) or isinstance(artifact["size_in_bytes"], bool) or artifact["size_in_bytes"] <= 0:
              fail("artifact size_in_bytes is a positive integer")
          if artifact["expired"] is not False:
              fail("artifact expired is false")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["digest"]):
              fail("artifact digest matches sha256:<64 lowercase hex>")

          workflow_run = artifact["workflow_run"]
          if not isinstance(workflow_run, dict) or "id" not in workflow_run or "head_sha" not in workflow_run:
              fail("artifact workflow_run contains id and head_sha")
          if not isinstance(workflow_run["id"], int) or isinstance(workflow_run["id"], bool):
              fail("artifact workflow_run id has an integer type")
          if not isinstance(workflow_run["head_sha"], str):
              fail("artifact workflow_run head_sha has a string type")
          if workflow_run["id"] != int(sys.argv[3]):
              fail("artifact workflow_run id == int(VALIDATED_RUN_ID)")
          if workflow_run["head_sha"] != sys.argv[4]:
              fail("artifact workflow_run head_sha == DISPATCH_SHA")

          print(f"ARTIFACT_ID={artifact['id']}")
          print(f"ARTIFACT_DIGEST={artifact['digest'][len('sha256:'):]}")
          print(f"ARTIFACT_SIZE={artifact['size_in_bytes']}")
          PY
          )"; then
            echo "assertion: validated release artifact metadata verification failed; run a new validate dispatch; failing closed." >&2
            exit 1
          fi

          if [[ "$artifact_metadata" != *$'\n'* ]]; then
            echo "assertion: artifact metadata parser output is malformed; run a new validate dispatch; failing closed." >&2
            exit 1
          fi
          artifact_id_line="${artifact_metadata%%$'\n'*}"
          artifact_metadata_tail="${artifact_metadata#*$'\n'}"
          if [[ "$artifact_metadata_tail" != *$'\n'* ]]; then
            echo "assertion: artifact metadata parser output is incomplete; run a new validate dispatch; failing closed." >&2
            exit 1
          fi
          artifact_digest_line="${artifact_metadata_tail%%$'\n'*}"
          artifact_size_line="${artifact_metadata_tail#*$'\n'}"
          if [[ "$artifact_size_line" == *$'\n'* ]]; then
            echo "assertion: artifact metadata parser output has extra fields; run a new validate dispatch; failing closed." >&2
            exit 1
          fi
          if [[ ! "$artifact_id_line" =~ ^ARTIFACT_ID=[0-9]+$ || ! "$artifact_digest_line" =~ ^ARTIFACT_DIGEST=[0-9a-f]{64}$ || ! "$artifact_size_line" =~ ^ARTIFACT_SIZE=[1-9][0-9]*$ ]]; then
            echo "assertion: artifact metadata parser output failed bash validation; run a new validate dispatch; failing closed." >&2
            exit 1
          fi
          ARTIFACT_ID="${artifact_id_line#ARTIFACT_ID=}"
          ARTIFACT_DIGEST="${artifact_digest_line#ARTIFACT_DIGEST=}"
          ARTIFACT_SIZE="${artifact_size_line#ARTIFACT_SIZE=}"

          zip_file="$RUNNER_TEMP/validated-release-artifact.zip"
          rm -f "$zip_file"
          zip_fetched=false
          for ((attempt=1; attempt<=3; attempt++)); do
            if gh api "repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$zip_file" 2>/dev/null; then
              zip_fetched=true
              break
            fi
            if (( attempt < 3 )); then
              sleep 5
            fi
          done
          if [[ "$zip_fetched" != true || ! -s "$zip_file" ]]; then
            echo "assertion: validated release artifact download failed, was empty, or may have expired (including HTTP 410); run a new validate dispatch; failing closed." >&2
            exit 1
          fi

          downloaded_size="$(wc -c < "$zip_file" | tr -d '[:space:]')"
          if [[ "$downloaded_size" != "$ARTIFACT_SIZE" ]]; then
            echo "assertion: downloaded artifact size does not match GitHub metadata; run a new validate dispatch; failing closed." >&2
            exit 1
          fi
          zip_digest="$(sha256sum "$zip_file" | awk '{print $1}')"
          if [[ "$zip_digest" != "$ARTIFACT_DIGEST" ]]; then
            echo "assertion: downloaded artifact ZIP digest does not match GitHub's digest; run a new validate dispatch; failing closed." >&2
            exit 1
          fi

          extracted_dir="$(mktemp -d "$RUNNER_TEMP/validated-release-tarballs.XXXXXX")"
          if ! python3 - "$zip_file" "$extracted_dir" "$CORE_TARBALL_BASE" "$CORE_VERSION" "$ADAPTER_TARBALL_BASE" "$PI_VERSION" <<'PY'
          import os
          import re
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          def fail(assertion):
              print(f"assertion failed: {assertion}; failing closed.", file=sys.stderr)
              raise SystemExit(2)

          zip_path = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          core_name = f"{sys.argv[3]}-{sys.argv[4]}.tgz"
          adapter_name = f"{sys.argv[5]}-{sys.argv[6]}.tgz"
          try:
              with zipfile.ZipFile(zip_path) as zf:
                  infos = zf.infolist()
                  if len(infos) != 2:
                      fail("ZIP has exactly two members")
                  names = [info.filename for info in infos]
                  if len(set(names)) != len(names):
                      fail("ZIP member names are unique")
                  for info in infos:
                      name = info.filename
                      if not isinstance(name, str) or not name:
                          fail("ZIP member name is non-empty")
                      if info.is_dir():
                          fail("ZIP has no directory members")
                      if "/" in name or "\\" in name:
                          fail("ZIP member paths are flat")
                      if os.path.isabs(name) or name.startswith("/") or re.match(r"^[A-Za-z]:", name):
                          fail("ZIP member paths are not absolute")
                      if ".." in name.split("/"):
                          fail("ZIP member paths contain no .. component")
                      if name != os.path.basename(name):
                          fail("ZIP member name equals its basename")
                      if not name.endswith(".tgz"):
                          fail("ZIP members are .tgz files")
                      mode = (info.external_attr >> 16) & 0o170000
                      if mode == 0o120000:
                          fail("ZIP member is not a symlink")
                      if mode not in (0, 0o100000):
                          fail("ZIP member has only regular-file mode bits")
                  if names.count(core_name) != 1:
                      fail("ZIP contains exactly one expected core tarball")
                  if names.count(adapter_name) != 1:
                      fail("ZIP contains exactly one expected adapter tarball")
                  if any(destination.iterdir()):
                      fail("ZIP extraction destination is fresh")
                  for info in infos:
                      member_name = os.path.basename(info.filename)
                      target = destination / member_name
                      with zf.open(info) as source, target.open("wb") as output:
                          shutil.copyfileobj(source, output)
          except zipfile.BadZipFile:
              fail("ZIP is valid")
          PY
          then
            echo "assertion: strict validated artifact ZIP inspection or extraction failed; run a new validate dispatch; failing closed." >&2
            exit 1
          fi

          core_tarball="$extracted_dir/${CORE_TARBALL_BASE}-${CORE_VERSION}.tgz"
          pi_tarball="$extracted_dir/${ADAPTER_TARBALL_BASE}-${PI_VERSION}.tgz"
          if [[ ! -f "$core_tarball" || ! -f "$pi_tarball" ]]; then
            echo "assertion: strict ZIP extraction did not produce both expected tarballs; run a new validate dispatch; failing closed." >&2
            exit 1
          fi

          if ! python3 - "$core_tarball" "$pi_tarball" "$CORE_VERSION" "$PI_VERSION" "$CORE_PKG_NAME" "$ADAPTER_PKG_NAME" <<'PY'
          import json
          import sys
          import tarfile
          from pathlib import PurePosixPath

          core_tarball = sys.argv[1]
          pi_tarball = sys.argv[2]
          core_version = sys.argv[3]
          pi_version = sys.argv[4]
          core_package_name = sys.argv[5]
          adapter_package_name = sys.argv[6]
          expected = {
              core_tarball: (core_package_name, core_version),
              pi_tarball: (adapter_package_name, pi_version),
          }
          forbidden_parts = {"test", "tests", "benchmark", "benchmarks", ".git", ".npmrc"}

          def fail(message: str) -> None:
              raise SystemExit(f"Pre-publish artifact audit failed: {message}")

          audits = {}
          for archive, (expected_name, expected_version) in expected.items():
              with tarfile.open(archive, "r:gz") as tar:
                  members = tar.getmembers()
                  names = {member.name.rstrip("/") for member in members}
                  manifest_member = next(
                      (member for member in members if member.name.rstrip("/") == "package/package.json"),
                      None,
                  )
                  if manifest_member is None:
                      fail(f"{archive} has no package/package.json")
                  manifest_data = tar.extractfile(manifest_member)
                  if manifest_data is None:
                      fail(f"{archive} package manifest cannot be read")
                  try:
                      manifest = json.load(manifest_data)
                  except json.JSONDecodeError as error:
                      fail(f"{archive} has invalid package.json: {error}")
                  if not isinstance(manifest, dict):
                      fail(f"{archive} package manifest is not an object")

                  if manifest.get("name") != expected_name:
                      fail(f"{archive} has unexpected package name")
                  if manifest.get("version") != expected_version:
                      fail(f"{archive} has unexpected package version")
                  if "package/LICENSE" not in names:
                      fail(f"{archive} is missing LICENSE")
                  if "package/README.md" not in names:
                      fail(f"{archive} is missing README.md")
                  if not any(name == "package/dist" or name.startswith("package/dist/") for name in names):
                      fail(f"{archive} is missing dist/")
                  if not any(name == "package/src" or name.startswith("package/src/") for name in names):
                      fail(f"{archive} is missing src/")

                  for name in names:
                      parts = PurePosixPath(name).parts
                      if any(part in forbidden_parts for part in parts) or name.endswith(".tgz") or "/home/" in name:
                          fail(f"{archive} contains forbidden path {name}")
                  for member in members:
                      if not member.isfile():
                          continue
                      content = tar.extractfile(member)
                      if content is not None and b"/home/" in content.read():
                          fail(f"{archive} contains /home/ in {member.name}")

              audits[archive] = (manifest, names)

          core_manifest, core_names = audits[core_tarball]
          adapter_manifest, adapter_names = audits[pi_tarball]
          if core_manifest.get("name") != core_package_name or core_manifest.get("version") != core_version:
              fail("core tarball identification does not match the requested package")
          if adapter_manifest.get("name") != adapter_package_name or adapter_manifest.get("version") != pi_version:
              fail("adapter tarball identification does not match the requested package")

          dependencies = adapter_manifest.get("dependencies")
          if not isinstance(dependencies, dict):
              fail("adapter packed manifest has no dependencies object")
          dependency_text = json.dumps(dependencies, sort_keys=True)
          if any(marker in dependency_text for marker in ("workspace:", "file:", "link:")):
              fail("adapter packed dependencies contain workspace:, file:, or link:")
          expected_dependency = f"^{core_version}"
          actual_dependency = dependencies.get(core_package_name)
          if actual_dependency != expected_dependency:
              fail(
                  f"adapter packed dependency on {core_package_name} "
                  f"is {actual_dependency!r}, expected {expected_dependency!r}"
              )

          pi_manifest = adapter_manifest.get("pi")
          extensions = pi_manifest.get("extensions") if isinstance(pi_manifest, dict) else None
          if not isinstance(extensions, list) or not extensions:
              fail("adapter packed manifest has no pi.extensions entry")
          for target in extensions:
              if not isinstance(target, str) or target.startswith("/"):
                  fail(f"adapter pi.extensions target is invalid: {target!r}")
              target_path = target[2:] if target.startswith("./") else target
              if not target_path or f"package/{target_path}" not in adapter_names:
                  fail(f"adapter pi.extensions target is missing: {target!r}")

          print("Validated release tarballs passed manifest, contents, dependency, extension, and path audits.")
          PY
          then
            echo "assertion: downloaded validated tarball audit failed; run a new validate dispatch; failing closed." >&2
            exit 1
          fi

          printf 'core_tarball=%s\n' "$core_tarball" >> "$GITHUB_OUTPUT"
          printf 'pi_tarball=%s\n' "$pi_tarball" >> "$GITHUB_OUTPUT"

      - name: Registry preflight
        id: registry_preflight
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_TARBALL: ${{ steps.validated_tarballs.outputs.core_tarball }}
          PI_VERSION: ${{ inputs.pi_version }}
          ALLOW_EXISTING_CORE: ${{ inputs.allow_existing_core }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ALLOW_EXISTING_CORE" in
            true|false)
              ;;
            *)
              echo "allow_existing_core must be a boolean input." >&2
              exit 1
              ;;
          esac

          core_view_file="$RUNNER_TEMP/core-registry-view"
          adapter_view_file="$RUNNER_TEMP/adapter-registry-view"
          rm -f "$core_view_file" "$adapter_view_file"

          core_exists=false
          if npm view "$CORE_PKG_NAME@$CORE_VERSION" --json > "$core_view_file" 2>&1; then
            core_exists=true
          fi
          adapter_exists=false
          if npm view "$ADAPTER_PKG_NAME@$PI_VERSION" --json > "$adapter_view_file" 2>&1; then
            adapter_exists=true
          fi

          if [[ "$core_exists" == false && "$adapter_exists" == false ]]; then
            state='A'
          elif [[ "$core_exists" == true && "$adapter_exists" == false ]]; then
            state='B'
          elif [[ "$core_exists" == false && "$adapter_exists" == true ]]; then
            state='C'
          else
            state='D'
          fi

          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          printf 'core_exists=%s\n' "$core_exists" >> "$GITHUB_OUTPUT"
          printf 'adapter_exists=%s\n' "$adapter_exists" >> "$GITHUB_OUTPUT"

          case "$state" in
            A)
              printf 'publish_core=true\n' >> "$GITHUB_OUTPUT"
              printf 'publish_adapter=true\n' >> "$GITHUB_OUTPUT"
              echo "Registry state A: neither requested version exists; core then adapter will be published."
              ;;
            B)
              if [[ "$ALLOW_EXISTING_CORE" != true ]]; then
                printf 'publish_core=false\n' >> "$GITHUB_OUTPUT"
                printf 'publish_adapter=false\n' >> "$GITHUB_OUTPUT"
                echo "Core version already exists while the adapter version does not. Re-dispatch with allow_existing_core=true for deliberate partial recovery." >&2
                exit 1
              fi

              core_identity_file="$RUNNER_TEMP/core-registry-identity"
              core_identity_error_file="$RUNNER_TEMP/core-registry-identity.err"
              rm -f "$core_identity_file" "$core_identity_error_file"
              max_attempts=40
              retry_delay=15
              core_identity_visible=false
              for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
                if npm view "$CORE_PKG_NAME@$CORE_VERSION" name version repository --prefer-online --json > "$core_identity_file" 2> "$core_identity_error_file"; then
                  core_identity_visible=true
                  break
                fi
                if (( attempt < max_attempts )); then
                  echo "Waiting for $CORE_PKG_NAME@$CORE_VERSION on the public registry (attempt $attempt/$max_attempts); retrying in ${retry_delay}s."
                  sleep "$retry_delay"
                fi
              done
              if [[ "$core_identity_visible" != true ]]; then
                echo "Existing core could not be verified; refusing partial recovery. The version did not become visible on the public registry within the wait window." >&2
                cat "$core_identity_error_file" >&2
                exit 1
              fi
              python3 - "$core_identity_file" "$CORE_VERSION" "$CORE_PKG_NAME" <<'PY'
          import json
          import sys

          expected_package_name = sys.argv[3]
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          if isinstance(data, list):
              if len(data) != 1:
                  raise SystemExit("Existing core verification returned an unexpected list.")
              data = data[0]
          if not isinstance(data, dict):
              raise SystemExit("Existing core verification returned no manifest object.")
          if data.get("name") != expected_package_name:
              raise SystemExit("Existing core has an unexpected package name.")
          if data.get("version") != sys.argv[2]:
              raise SystemExit("Existing core has an unexpected version.")
          repository_text = json.dumps(data.get("repository"), sort_keys=True)
          if "j1nn0/agent-primitives" not in repository_text:
              raise SystemExit("Existing core repository does not identify j1nn0/agent-primitives.")
          print("Existing core identity and repository verified for partial recovery.")
          PY
              core_integrity_file="$RUNNER_TEMP/core-registry-integrity"
              core_integrity_error_file="$RUNNER_TEMP/core-registry-integrity.err"

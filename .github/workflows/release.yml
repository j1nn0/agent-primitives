          import base64
          import hashlib
          import sys

          digest = hashlib.sha512()
          with open(sys.argv[1], "rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          print("sha512-" + base64.b64encode(digest.digest()).decode("ascii"))
          PY
              )"; then

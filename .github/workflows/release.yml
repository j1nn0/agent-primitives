name: Release

on:
  workflow_dispatch:
    inputs:
      family:
        description: Package family to release
        required: true
        default: context-guard
        type: choice
        options:
          - context-guard
          - agent-state
          - agent-progress
          - agent-retry-guard
          - agent-evidence
          - agent-handoff
          - agent-budget
          - agent-tool-policy
      mode:
        description: Release mode
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish
      core_version:
        description: Version of the core package of the selected family to release
        required: true
        default: 0.1.1
        type: string
      pi_version:
        description: Version of the Pi adapter package of the selected family to release
        required: true
        default: 0.1.1
        type: string
      confirmation:
        description: 'Required in publish mode: publish-<family>-<core_version>-<pi_version>'
        required: false
        default: ''
        type: string
      allow_existing_core:
        description: Allow partial recovery when the requested core version already exists
        required: false
        default: false
        type: boolean
      validated_run_id:
        description: 'Required in publish mode: run ID of a successful validate-mode run for the same family, versions, and commit'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    env:
      CORE_PKG_NAME: ${{ inputs.family == 'agent-tool-policy' && '@j1nn0/agent-tool-policy' || inputs.family == 'agent-budget' && '@j1nn0/agent-budget' || inputs.family == 'agent-handoff' && '@j1nn0/agent-handoff' || inputs.family == 'agent-evidence' && '@j1nn0/agent-evidence' || inputs.family == 'agent-retry-guard' && '@j1nn0/agent-retry-guard' || inputs.family == 'agent-progress' && '@j1nn0/agent-progress' || inputs.family == 'agent-state' && '@j1nn0/agent-state' || '@j1nn0/agent-context-guard' }}
      ADAPTER_PKG_NAME: ${{ inputs.family == 'agent-tool-policy' && '@j1nn0/agent-tool-policy-pi' || inputs.family == 'agent-budget' && '@j1nn0/agent-budget-pi' || inputs.family == 'agent-handoff' && '@j1nn0/agent-handoff-pi' || inputs.family == 'agent-evidence' && '@j1nn0/agent-evidence-pi' || inputs.family == 'agent-retry-guard' && '@j1nn0/agent-retry-guard-pi' || inputs.family == 'agent-progress' && '@j1nn0/agent-progress-pi' || inputs.family == 'agent-state' && '@j1nn0/agent-state-pi' || '@j1nn0/agent-context-guard-pi' }}
      CORE_PKG_DIR: ${{ inputs.family == 'agent-tool-policy' && 'packages/agent-tool-policy' || inputs.family == 'agent-budget' && 'packages/agent-budget' || inputs.family == 'agent-handoff' && 'packages/agent-handoff' || inputs.family == 'agent-evidence' && 'packages/agent-evidence' || inputs.family == 'agent-retry-guard' && 'packages/agent-retry-guard' || inputs.family == 'agent-progress' && 'packages/agent-progress' || inputs.family == 'agent-state' && 'packages/agent-state' || 'packages/context-guard' }}
      ADAPTER_PKG_DIR: ${{ inputs.family == 'agent-tool-policy' && 'packages/agent-tool-policy-pi' || inputs.family == 'agent-budget' && 'packages/agent-budget-pi' || inputs.family == 'agent-handoff' && 'packages/agent-handoff-pi' || inputs.family == 'agent-evidence' && 'packages/agent-evidence-pi' || inputs.family == 'agent-retry-guard' && 'packages/agent-retry-guard-pi' || inputs.family == 'agent-progress' && 'packages/agent-progress-pi' || inputs.family == 'agent-state' && 'packages/agent-state-pi' || 'packages/context-guard-pi' }}
      CORE_TARBALL_BASE: ${{ inputs.family == 'agent-tool-policy' && 'j1nn0-agent-tool-policy' || inputs.family == 'agent-budget' && 'j1nn0-agent-budget' || inputs.family == 'agent-handoff' && 'j1nn0-agent-handoff' || inputs.family == 'agent-evidence' && 'j1nn0-agent-evidence' || inputs.family == 'agent-retry-guard' && 'j1nn0-agent-retry-guard' || inputs.family == 'agent-progress' && 'j1nn0-agent-progress' || inputs.family == 'agent-state' && 'j1nn0-agent-state' || 'j1nn0-agent-context-guard' }}
      ADAPTER_TARBALL_BASE: ${{ inputs.family == 'agent-tool-policy' && 'j1nn0-agent-tool-policy-pi' || inputs.family == 'agent-budget' && 'j1nn0-agent-budget-pi' || inputs.family == 'agent-handoff' && 'j1nn0-agent-handoff-pi' || inputs.family == 'agent-evidence' && 'j1nn0-agent-evidence-pi' || inputs.family == 'agent-retry-guard' && 'j1nn0-agent-retry-guard-pi' || inputs.family == 'agent-progress' && 'j1nn0-agent-progress-pi' || inputs.family == 'agent-state' && 'j1nn0-agent-state-pi' || 'j1nn0-agent-context-guard-pi' }}
    outputs:
      validated_run_attempt: ${{ steps.validate_reuse.outputs.run_attempt }}
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate release inputs and manifests
        env:
          FAMILY: ${{ inputs.family }}
          MODE: ${{ inputs.mode }}
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
          CONFIRMATION: ${{ inputs.confirmation }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$CORE_VERSION" =~ $version_pattern ]]; then
            echo "Invalid core_version: must be a semantic version without a leading v." >&2
            exit 1
          fi
          if [[ ! "$PI_VERSION" =~ $version_pattern ]]; then
            echo "Invalid pi_version: must be a semantic version without a leading v." >&2
            exit 1
          fi

          manifest_core_version="$(node -p "JSON.parse(require('node:fs').readFileSync('$CORE_PKG_DIR/package.json', 'utf8')).version")"
          manifest_pi_version="$(node -p "JSON.parse(require('node:fs').readFileSync('$ADAPTER_PKG_DIR/package.json', 'utf8')).version")"
          if [[ "$CORE_VERSION" != "$manifest_core_version" ]]; then
            echo "core_version $CORE_VERSION does not match $CORE_PKG_DIR/package.json ($manifest_core_version)." >&2
            exit 1
          fi
          if [[ "$PI_VERSION" != "$manifest_pi_version" ]]; then
            echo "pi_version $PI_VERSION does not match $ADAPTER_PKG_DIR/package.json ($manifest_pi_version)." >&2
            exit 1
          fi

          case "$MODE" in
            validate|publish)
              ;;
            *)
              echo "Invalid mode: expected validate or publish." >&2
              exit 1
              ;;
          esac

          if [[ "$MODE" == "publish" ]]; then
            expected_confirmation="publish-${FAMILY}-${CORE_VERSION}-${PI_VERSION}"
            if [[ "$CONFIRMATION" != "$expected_confirmation" ]]; then
              echo "Invalid confirmation. Expected exactly: $expected_confirmation" >&2
              exit 1
            fi
            if [[ -z "$VALIDATED_RUN_ID" ]]; then
              echo "validated_run_id is required in publish mode." >&2
              exit 1
            fi
          fi
          if [[ -n "$VALIDATED_RUN_ID" ]]; then
            if [[ "$MODE" != "publish" ]]; then
              echo "validated_run_id is only allowed in publish mode." >&2
              exit 1
            fi
            if [[ ! "$VALIDATED_RUN_ID" =~ ^[0-9]{1,19}$ ]]; then
              echo "Invalid validated_run_id: must be a numeric Actions run ID with at most 19 digits." >&2
              exit 1
            fi
          fi

      - name: Require successful CI on the dispatched commit
        env:
          DISPATCH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=30
          ci_success=false
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            ci_runs_file="$RUNNER_TEMP/ci-runs-${attempt}.json"
            if ! gh api "repos/${REPOSITORY}/actions/runs?head_sha=${DISPATCH_SHA}&workflow=.github/workflows/ci.yml&head_branch=main&event=push&per_page=100" > "$ci_runs_file" 2>/dev/null; then
              echo "CI runs API request failed on attempt ${attempt}/${max_attempts}; retrying." >&2
            elif python3 - "$ci_runs_file" "$DISPATCH_SHA" <<'PY'
          import json, sys

          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              print("CI runs response was not valid JSON.", file=sys.stderr)
              raise SystemExit(1)

          sha = sys.argv[2]
          if not isinstance(data, dict):
              print("CI runs response had an unexpected shape.", file=sys.stderr)
              raise SystemExit(1)

          runs = data.get("workflow_runs", [])
          if (
              not isinstance(runs, list)
              or not isinstance(data.get("total_count"), int)
              or isinstance(data.get("total_count"), bool)
              or any(not isinstance(run, dict) for run in runs)
          ):
              print("CI runs response had an unexpected shape.", file=sys.stderr)
              raise SystemExit(1)

          if data["total_count"] > len(runs):
              print("CI runs result window truncated.", file=sys.stderr)
              raise SystemExit(1)

          candidates = [
              r for r in runs
              if r.get("head_sha") == sha
              and r.get("event") == "push"
              and r.get("head_branch") == "main"
              and r.get("path") == ".github/workflows/ci.yml"
          ]

          if candidates:
              latest = max(candidates, key=lambda r: r.get("run_number", -1))
              terminal_conclusions = {"failure", "cancelled", "timed_out", "startup_failure"}
              r = latest
              if r.get("status") == "completed":
                  if r.get("conclusion") == "success":
                      print(f"Found successful CI run for {sha}.")
                      raise SystemExit(0)
                  if r.get("conclusion") in terminal_conclusions or r.get("conclusion") != "success":
                      print(
                          f"Latest matching CI run is terminal CI: {r.get('conclusion')}.",
                          file=sys.stderr,
                      )
                      raise SystemExit(2)

          observed = sorted({f"{r.get('status')}/{r.get('conclusion')}" for r in runs})
          print(f"No successful CI run for {sha}; observed states: {', '.join(observed) or 'none'}.", file=sys.stderr)
          raise SystemExit(1)
          PY
            then
              echo "Successful CI run verified for ${DISPATCH_SHA}."
              ci_success=true
              break
            else
              parser_status=$?
              if (( parser_status == 2 )); then
                echo "CI preflight observed terminal CI failure; failing closed." >&2
                exit 1
              fi
              echo "CI preflight attempt ${attempt}/${max_attempts} did not find a qualifying run." >&2
            fi
            if (( attempt < max_attempts )); then
              sleep 10
            fi
          done

          if [[ "$ci_success" != true ]]; then
            echo "CI preflight exhausted ${max_attempts} attempts; failing closed." >&2
            exit 1
          fi

      - name: Verify the referenced validated run
        id: validate_reuse
        env:
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
          MODE: ${{ inputs.mode }}
          DISPATCH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
          FAMILY: ${{ inputs.family }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$VALIDATED_RUN_ID" ]]; then
            if [[ "$MODE" == "publish" ]]; then
              echo "assertion: VALIDATED_RUN_ID is required in publish mode; run a new validate dispatch first; failing closed." >&2
              exit 1
            fi
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "No validated run ID supplied; running full validation."
            exit 0
          fi

          if [[ ! "$VALIDATED_RUN_ID" =~ ^[0-9]{1,19}$ ]]; then
            echo "assertion: VALIDATED_RUN_ID must match ^[0-9]{1,19}$; failing closed." >&2
            exit 1
          fi

          validated_run_file="$RUNNER_TEMP/validated-run-${VALIDATED_RUN_ID}.json"
          validated_run_fetched=false
          for ((attempt=1; attempt<=3; attempt++)); do
            if gh api "repos/${REPOSITORY}/actions/runs/${VALIDATED_RUN_ID}" > "$validated_run_file" 2>/dev/null; then
              validated_run_fetched=true
              break
            fi
            if (( attempt < 3 )); then
              sleep 5
            fi
          done
          if [[ "$validated_run_fetched" != true ]]; then
            echo "assertion: validated run API fetch failed after 3 attempts; failing closed." >&2
            exit 1
          fi

          if ! validated_run_metadata="$(python3 - "$validated_run_file" "$DISPATCH_SHA" "$CURRENT_RUN_NUMBER" "$VALIDATED_RUN_ID" <<'PY'
          import json
          import sys
          from types import SimpleNamespace

          def fail(assertion):
              print(f"assertion failed: {assertion}; failing closed.", file=sys.stderr)
              raise SystemExit(2)

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  data = json.load(handle)
          except (OSError, json.JSONDecodeError):
              fail("validated run response is valid JSON")

          if not isinstance(data, dict):
              fail("validated run response is a dict")

          required_fields = {
              "id",
              "path",
              "event",
              "status",
              "conclusion",
              "head_sha",
              "head_branch",
              "run_number",
              "run_attempt",
          }
          if any(field not in data for field in required_fields):
              fail("validated run response contains all required fields")

          for field in ("id", "run_number", "run_attempt"):
              if not isinstance(data[field], int) or isinstance(data[field], bool):
                  fail(f"validated run {field} has an integer type")
          for field in ("path", "event", "status", "conclusion", "head_sha", "head_branch"):
              if not isinstance(data[field], str):
                  fail(f"validated run {field} has a string type")

          try:
              current_run_number = int(sys.argv[3])
          except ValueError:
              fail("CURRENT_RUN_NUMBER is an integer")

          r = SimpleNamespace(**data)
          dispatch_sha = sys.argv[2]
          if not (r.id == int(sys.argv[4])):
              fail("r.id == int(VALIDATED_RUN_ID)")
          if not (r.path == ".github/workflows/release.yml"):
              fail('r.path == ".github/workflows/release.yml"')
          if not (r.event == "workflow_dispatch"):
              fail('r.event == "workflow_dispatch"')
          if not (r.status == "completed"):
              fail('r.status == "completed"')
          if not (r.conclusion == "success"):
              fail('r.conclusion == "success"')
          if not (r.head_sha == dispatch_sha):
              fail("r.head_sha == dispatch_sha")
          if not (r.head_branch == "main"):
              fail('r.head_branch == "main"')
          if not (r.run_number < current_run_number):
              fail("r.run_number < current_run_number")

          print(f"VALIDATED_RUN_ATTEMPT={r.run_attempt}")
          PY
          )"; then
            echo "assertion: validated run metadata verification failed; failing closed." >&2
            exit 1
          fi

          run_attempt_line="${validated_run_metadata##*$'\n'}"
          if [[ "$run_attempt_line" != VALIDATED_RUN_ATTEMPT=* ]]; then
            echo "assertion: validated run attempt parser output is missing; failing closed." >&2
            exit 1
          fi
          RUN_ATTEMPT="${run_attempt_line#VALIDATED_RUN_ATTEMPT=}"
          if [[ ! "$RUN_ATTEMPT" =~ ^[0-9]{1,9}$ ]]; then
            echo "assertion: validated run attempt must contain 1-9 digits; failing closed." >&2
            exit 1
          fi

          jobs_file="$RUNNER_TEMP/validated-run-${VALIDATED_RUN_ID}-attempt-${RUN_ATTEMPT}-jobs.json"
          jobs_fetched=false
          for ((attempt=1; attempt<=3; attempt++)); do
            if gh api "repos/${REPOSITORY}/actions/runs/${VALIDATED_RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" > "$jobs_file" 2>/dev/null; then
              jobs_fetched=true
              break
            fi
            if (( attempt < 3 )); then
              sleep 5
            fi
          done
          if [[ "$jobs_fetched" != true ]]; then
            echo "assertion: attempt-specific validated run jobs API fetch failed after 3 attempts; failing closed." >&2
            exit 1
          fi

          if ! python3 - "$jobs_file" "$RUN_ATTEMPT" "$FAMILY" <<'PY'
          import json
          import sys

          def fail(assertion):
              print(f"assertion failed: {assertion}; failing closed.", file=sys.stderr)
              raise SystemExit(2)

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  data = json.load(handle)
          except (OSError, json.JSONDecodeError):
              fail("validated run jobs response is valid JSON")

          if not isinstance(data, dict):
              fail("validated run jobs response is a dict")
          total_count = data.get("total_count")
          jobs = data.get("jobs")
          if not isinstance(total_count, int) or isinstance(total_count, bool):
              fail("total_count has an integer type")
          if not isinstance(jobs, list) or any(not isinstance(job, dict) for job in jobs):
              fail("jobs is a list of job dictionaries")
          if not (total_count == len(jobs)):
              fail("total_count == len(jobs)")

          expected_job_names = {"validate", "publish", "registry-smoke"}
          jobs_by_name = {}
          for job_name in expected_job_names:
              matches = [job for job in jobs if job.get("name") == job_name]
              if len(matches) != 1:
                  fail(f"exactly one job named {job_name!r}")
              jobs_by_name[job_name] = matches[0]
          for job in jobs:
              if job.get("name") not in expected_job_names:
                  fail("unexpected extra job names")
              if any(field not in job for field in ("name", "conclusion", "status", "run_attempt", "steps")):
                  fail("job contains all required fields")
              job_attempt = job.get("run_attempt")
              if not isinstance(job_attempt, int) or isinstance(job_attempt, bool):
                  fail("job run_attempt has an integer type")
              run_attempt = int(sys.argv[2])
              if not (run_attempt == job_attempt):
                  fail("run_attempt == job['run_attempt']")

          if not (jobs_by_name["validate"]["conclusion"] == "success"):
              fail('validate job conclusion == "success"')
          if not (jobs_by_name["publish"]["conclusion"] == "skipped"):
              fail('publish job conclusion == "skipped"')
          if not (jobs_by_name["registry-smoke"]["conclusion"] == "skipped"):
              fail('registry-smoke job conclusion == "skipped"')

          validate_steps = jobs_by_name["validate"]["steps"]
          if not isinstance(validate_steps, list) or any(not isinstance(step, dict) for step in validate_steps):
              fail("validate job steps is a list of step dictionaries")

          required_validate_step_names = [
              "Validate release inputs and manifests",
              "Require successful CI on the dispatched commit",
              "Lint",
              "Build from a clean dist",
              "Typecheck",
              "Test",
              "Check package quality",
              "Run example",
              "Dry-run pnpm package publication",
              "Pack release artifacts",
              "Extract and audit release artifacts",
              "Upload validated release tarballs",
          ]
          for required_name in required_validate_step_names:
              required_matches = [step for step in validate_steps if step.get("name") == required_name]
              if len(required_matches) != 1:
                  fail(f"required validate step {required_name!r} appears exactly once")
              if not (required_matches[0].get("conclusion") == "success"):
                  fail(f"required validate step {required_name!r} conclusion == \"success\"")

          smoke_steps = {
              "context-guard": "Smoke-test Context Guard packed artifacts in a fresh consumer",
              "agent-state": "Smoke-test Agent State packed artifacts in a fresh consumer",
              "agent-progress": "Smoke-test Progress packed artifacts in a fresh consumer",
              "agent-retry-guard": "Smoke-test Retry Guard packed artifacts in a fresh consumer",
              "agent-evidence": "Smoke-test Evidence packed artifacts in a fresh consumer",
              "agent-handoff": "Smoke-test Handoff packed artifacts in a fresh consumer",
              "agent-budget": "Smoke-test Budget packed artifacts in a fresh consumer",
              "agent-tool-policy": "Smoke-test Tool Policy packed artifacts in a fresh consumer",
          }
          family = sys.argv[3]
          if family not in smoke_steps:
              fail("unknown FAMILY")
          smoke_matches_by_name = {}
          for smoke_name in smoke_steps.values():
              smoke_matches = [step for step in validate_steps if step.get("name") == smoke_name]
              if len(smoke_matches) != 1:
                  fail(f"smoke step {smoke_name!r} appears exactly once")
              smoke_matches_by_name[smoke_name] = smoke_matches[0]

          selected_smoke = smoke_steps[family]
          selected_matches = [step for step in validate_steps if step.get("name") == selected_smoke]
          if len(selected_matches) != 1:
              fail("selected family smoke step appears exactly once")
          if not (selected_matches[0].get("conclusion") == "success"):
              fail('selected family smoke step conclusion == "success"')
          for smoke_family, smoke_name in smoke_steps.items():
              if smoke_family == family:
                  continue
              if not (smoke_matches_by_name[smoke_name].get("conclusion") == "skipped"):
                  fail(f"unselected family smoke step {smoke_name!r} conclusion == \"skipped\"")
          PY
          then
            echo "assertion: validated run jobs verification failed; failing closed." >&2
            exit 1
          fi

          echo "reuse=true" >> "$GITHUB_OUTPUT"
          printf 'run_attempt=%s\n' "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "Validated run ${VALIDATED_RUN_ID} is a verified validate-mode run for ${FAMILY}; skipping duplicated validation."
          exit 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ steps.validate_reuse.outputs.reuse != 'true' }}
        run: pnpm lint

      - name: Build from a clean dist
        if: ${{ steps.validate_reuse.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CORE_PKG_DIR/dist" "$ADAPTER_PKG_DIR/dist"
          pnpm list -r --filter "$ADAPTER_PKG_NAME..." --depth -1 --json | node -e 'const fs=require("node:fs");const actual=JSON.parse(fs.readFileSync(0,"utf8")).map((entry)=>entry.name).sort();const expected=[process.env.CORE_PKG_NAME,process.env.ADAPTER_PKG_NAME].sort();if(actual.length!==expected.length||actual.some((name,index)=>name!==expected[index])){console.error("Family package set mismatch: "+JSON.stringify(actual)+" instead of "+JSON.stringify(expected));process.exit(1);}'
          pnpm -r --filter "$ADAPTER_PKG_NAME..." run build

      - name: Typecheck
        if: ${{ steps.validate_reuse.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm list -r --filter "$ADAPTER_PKG_NAME..." --depth -1 --json | node -e 'const fs=require("node:fs");const actual=JSON.parse(fs.readFileSync(0,"utf8")).map((entry)=>entry.name).sort();const expected=[process.env.CORE_PKG_NAME,process.env.ADAPTER_PKG_NAME].sort();if(actual.length!==expected.length||actual.some((name,index)=>name!==expected[index])){console.error("Family package set mismatch: "+JSON.stringify(actual)+" instead of "+JSON.stringify(expected));process.exit(1);}'
          pnpm -r --filter "$ADAPTER_PKG_NAME..." run typecheck

      - name: Test
        if: ${{ steps.validate_reuse.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm list -r --filter "$ADAPTER_PKG_NAME..." --depth -1 --json | node -e 'const fs=require("node:fs");const actual=JSON.parse(fs.readFileSync(0,"utf8")).map((entry)=>entry.name).sort();const expected=[process.env.CORE_PKG_NAME,process.env.ADAPTER_PKG_NAME].sort();if(actual.length!==expected.length||actual.some((name,index)=>name!==expected[index])){console.error("Family package set mismatch: "+JSON.stringify(actual)+" instead of "+JSON.stringify(expected));process.exit(1);}'
          pnpm -r --filter "$ADAPTER_PKG_NAME..." run test

      - name: Check package quality
        if: ${{ steps.validate_reuse.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm list -r --filter "$ADAPTER_PKG_NAME..." --depth -1 --json | node -e 'const fs=require("node:fs");const actual=JSON.parse(fs.readFileSync(0,"utf8")).map((entry)=>entry.name).sort();const expected=[process.env.CORE_PKG_NAME,process.env.ADAPTER_PKG_NAME].sort();if(actual.length!==expected.length||actual.some((name,index)=>name!==expected[index])){console.error("Family package set mismatch: "+JSON.stringify(actual)+" instead of "+JSON.stringify(expected));process.exit(1);}'
          pnpm -r --filter "$ADAPTER_PKG_NAME..." run check:package

      - name: Run example

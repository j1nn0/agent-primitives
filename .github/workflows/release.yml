          first_dependency = resolved_dependencies[0] if isinstance(resolved_dependencies, list) and resolved_dependencies else {}
          digest = first_dependency.get("digest") if isinstance(first_dependency, dict) else {}
          if not isinstance(digest, dict):
              digest = {}

          expected_commit = os.environ.get("RELEASE_COMMIT")
          if not expected_commit:
              raise SystemExit(
                  "buildDefinition.resolvedDependencies[0].digest.gitCommit mismatch: "
                  "expected the RELEASE_COMMIT environment value, actual environment value is missing"
              )
          expected_identity = {
              "buildDefinition.externalParameters.workflow.repository": "https://github.com/j1nn0/agent-primitives",
              "buildDefinition.externalParameters.workflow.path": ".github/workflows/release.yml",
              "buildDefinition.externalParameters.workflow.ref": "refs/heads/main",
              "buildDefinition.resolvedDependencies[0].digest.gitCommit": expected_commit,
          }
          actual_identity = {
              "buildDefinition.externalParameters.workflow.repository": workflow.get("repository"),
              "buildDefinition.externalParameters.workflow.path": workflow.get("path"),
              "buildDefinition.externalParameters.workflow.ref": workflow.get("ref"),
              "buildDefinition.resolvedDependencies[0].digest.gitCommit": digest.get("gitCommit"),
          }
          for field, expected_value in expected_identity.items():
              actual_value = actual_identity[field]
              if actual_value != expected_value:
                  raise SystemExit(
                      f"{field} mismatch: expected {expected_value!r}, actual {actual_value!r}"
                  )
          PY
            then
              pi_attestation_visible=true
              break
            fi
            if (( attempt < max_attempts )); then
              echo "Waiting for the Pi adapter provenance attestation (attempt $attempt/$max_attempts); retrying in ${retry_delay}s."
              sleep "$retry_delay"
            fi
          done
          if [[ "$pi_attestation_visible" != true ]]; then
            echo "Pi adapter provenance attestation did not appear for $ADAPTER_PKG_NAME@$PI_VERSION." >&2
            echo "Last attestation HTTP status: ${pi_attestation_status:-unknown}." >&2
            exit 1
          fi
          echo "Pi adapter provenance attestation verified for $ADAPTER_PKG_NAME@$PI_VERSION."

  registry-smoke:
    permissions:
      contents: read
    if: ${{ needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-latest
    env:
      CORE_PKG_NAME: ${{ inputs.family == 'agent-progress' && '@j1nn0/agent-progress' || inputs.family == 'agent-state' && '@j1nn0/agent-state' || '@j1nn0/agent-context-guard' }}
      ADAPTER_PKG_NAME: ${{ inputs.family == 'agent-progress' && '@j1nn0/agent-progress-pi' || inputs.family == 'agent-state' && '@j1nn0/agent-state-pi' || '@j1nn0/agent-context-guard-pi' }}
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}


      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Smoke-test Context Guard on the public registry anonymously
        if: ${{ inputs.family == 'context-guard' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/registry-consumer"
          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$CORE_PKG_NAME@$CORE_VERSION" "$ADAPTER_PKG_NAME@$PI_VERSION"
          node --input-type=module <<'NODE'
          import { createContextGuard, createLiteralVerifier } from '@j1nn0/agent-context-guard';
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          const guard = createContextGuard();
          guard.add({
            id: 'goal',
            kind: 'goal',
            content: 'Ship the public release safely.',
          });
          guard.add({
            id: 'critical-constraint',
            kind: 'constraint',
            content: 'Verify the core before the adapter.',
            critical: true,
          });
          const snapshot = guard.snapshot();
          assert(snapshot.items.length === 2, 'registry snapshot did not contain both items');

          const report = await guard.verify('Ship the public release safely.', {
            verifier: createLiteralVerifier(),
          });
          assert(report.ok === false, 'registry smoke accepted missing critical context');
          assert(report.lost.includes('critical-constraint'), 'registry smoke did not report the lost item');
          assert(
            report.criticalFailures.includes('critical-constraint'),
            'registry smoke did not report the critical failure',
          );

          const adapter = await import('@j1nn0/agent-context-guard-pi');
          assert(typeof adapter.default === 'function', 'installed Pi adapter default export is not a function');

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-context-guard-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const expectedDependency = `^${process.env.CORE_VERSION}`;
          assert(
            adapterManifest.dependencies?.['@j1nn0/agent-context-guard'] === expectedDependency,
            'installed adapter does not depend on the expected core version',
          );

          const peerManifestPath = join(
            process.cwd(),
            'node_modules',
            '@earendil-works',
            'pi-coding-agent',
            'package.json',
          );
          const peerManifest = JSON.parse(await readFile(peerManifestPath, 'utf8'));
          assert(typeof peerManifest.version === 'string', 'installed Pi peer has no version');
          console.log(`Installed @earendil-works/pi-coding-agent version: ${peerManifest.version}`);
          console.log('Public registry consumer smoke passed.');
          NODE
          signature_output_file="$RUNNER_TEMP/npm-audit-signatures"
          if npm audit signatures > "$signature_output_file" 2>&1; then
            cat "$signature_output_file"
          else
            cat "$signature_output_file"
            echo "npm audit signatures failed." >&2
            exit 1
          fi
          if ! grep -Eiq '[1-9][0-9]* packages? (has|have) (a )?verified attestations?' "$signature_output_file"; then
            echo "npm audit signatures reported no verified attestations." >&2
            exit 1
          fi

      - name: Smoke-test Agent State on the public registry anonymously
        if: ${{ inputs.family == 'agent-state' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/registry-consumer"
          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$CORE_PKG_NAME@$CORE_VERSION" "$ADAPTER_PKG_NAME@$PI_VERSION"
          node --input-type=module <<'NODE'
          import {
            createAgentState,
            restoreAgentState,
            summarizeAgentState,
          } from '@j1nn0/agent-state';
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          const state = createAgentState({ objective: 'Ship the public release safely.' });
          state.addWorkItem({ id: 'release', content: 'Publish the release.' });
          state.setWorkItemStatus('release', 'done');
          state.addDecision({ id: 'ordering', content: 'Publish the core before the adapter.' });
          const snapshot = state.snapshot();
          assert(snapshot.schemaVersion === 1, 'registry snapshot has an unexpected schema version');
          assert(snapshot.workItems.length === 1, 'registry snapshot did not contain the work item');
          assert(snapshot.workItems[0].status === 'done', 'registry work item status was not updated');
          assert(snapshot.decisions.length === 1, 'registry snapshot did not contain the decision');
          const summary = summarizeAgentState(snapshot);
          assert(
            summary.open === 0 &&
              summary.in_progress === 0 &&
              summary.blocked === 0 &&
              summary.done === 1 &&
              summary.total === 1,
            'registry Agent State summary counts were incorrect',
          );
          const restored = restoreAgentState(snapshot);
          assert(
            JSON.stringify(restored.snapshot()) === JSON.stringify(snapshot),
            'registry Agent State restore did not preserve the snapshot',
          );

          const adapter = await import('@j1nn0/agent-state-pi');
          assert(typeof adapter.default === 'function', 'installed Pi adapter default export is not a function');

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-state-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const expectedDependency = `^${process.env.CORE_VERSION}`;
          assert(
            adapterManifest.dependencies?.['@j1nn0/agent-state'] === expectedDependency,
            'installed adapter does not depend on the expected core version',
          );
          const peerManifestPath = join(
            process.cwd(),
            'node_modules',
            '@earendil-works',
            'pi-coding-agent',
            'package.json',
          );
          const peerManifest = JSON.parse(await readFile(peerManifestPath, 'utf8'));
          assert(typeof peerManifest.version === 'string', 'installed Pi peer has no version');
          console.log(`Installed @earendil-works/pi-coding-agent version: ${peerManifest.version}`);
          console.log('Public registry Agent State consumer smoke passed.');
          NODE
          signature_output_file="$RUNNER_TEMP/npm-audit-signatures"
          if npm audit signatures > "$signature_output_file" 2>&1; then
            cat "$signature_output_file"
          else
            cat "$signature_output_file"
            echo "npm audit signatures failed." >&2
            exit 1
          fi
          if ! grep -Eiq '[1-9][0-9]* packages? (has|have) (a )?verified attestations?' "$signature_output_file"; then
            echo "npm audit signatures reported no verified attestations." >&2
            exit 1
          fi


      - name: Smoke-test Progress on the public registry anonymously
        if: ${{ inputs.family == 'agent-progress' }}
        env:

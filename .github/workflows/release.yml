      - name: Smoke-test Handoff on the public registry anonymously
        if: ${{ inputs.family == 'agent-handoff' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/registry-consumer"
          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$CORE_PKG_NAME@$CORE_VERSION" "$ADAPTER_PKG_NAME@$PI_VERSION"
          node --input-type=module <<'NODE'
          import { createHandoff, HandoffError } from '@j1nn0/agent-handoff';
          import { deepStrictEqual } from 'node:assert/strict';
          import { accessSync } from 'node:fs';
          import { readFile } from 'node:fs/promises';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          const identity = createHandoff({
            schemaVersion: 1,
            id: 'ship-it',
            source: 'release-smoke',
            goal: 'Ship the public release safely.',
          });
          assert(
            identity.schemaVersion === 1 &&
              identity.id === 'ship-it' &&
              identity.source === 'release-smoke' &&
              identity.goal === 'Ship the public release safely.',
            'registry core identity was not preserved',
          );

          const constraints = ['verify-core', 'verify-core'];
          const openItems = ['await-ci', 'await-ci'];
          const prose = createHandoff({
            schemaVersion: 1,
            id: 'registry-prose-duplicates',
            source: 'release-smoke',
            goal: 'Preserve caller prose.',
            constraints,
            openItems,
          });
          deepStrictEqual(prose.constraints, constraints);
          deepStrictEqual(prose.openItems, openItems);

          let duplicateError;
          try {
            createHandoff({
              schemaVersion: 1,
              id: 'registry-duplicate-evidence',
              source: 'release-smoke',
              goal: 'Reject duplicate evidence references.',
              evidenceReferences: ['ev-dup', 'ev-dup'],
            });
          } catch (error) {
            duplicateError = error;
          }
          assert(
            duplicateError instanceof HandoffError &&
              duplicateError.name === 'HandoffError' &&
              duplicateError.code === 'invalid_input' &&
              duplicateError.message === 'Invalid handoff input.',
            'registry duplicate evidence references did not throw the expected HandoffError shape',
          );

          const adapterModule = await import('@j1nn0/agent-handoff-pi');
          const adapterDefault = adapterModule.default;
          assert(typeof adapterDefault === 'function', 'registry Pi adapter default export is not a function');

          const createShim = (seed = []) => {
            const handlers = new Map();
            const commands = new Map();
            const tools = [];
            const branch = structuredClone(seed);
            const api = {
              on: (event, handler) => handlers.set(event, handler),
              registerCommand: (name, def) => commands.set(name, def),
              registerTool: (def) => tools.push(def),
              appendEntry: (customType, data) => branch.push({ type: 'custom', customType, data }),
            };
            adapterDefault(api);
            return { handlers, commands, tools, branch };
          };

          const joinedText = (result) =>
            result.content
              .filter((content) => content.type === 'text')
              .map((content) => content.text)
              .join('');

          const findTool = (shim, name) => {
            const tool = shim.tools.find((candidate) => candidate.name === name);
            assert(tool !== undefined, 'registry expected Handoff tool was not registered');
            return tool;
          };

          const first = createShim();
          const ctx = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => first.branch },
          };
          const toolNames = first.tools.map((tool) => tool.name).sort();
          deepStrictEqual(toolNames, ['agent_handoff_create', 'agent_handoff_get', 'agent_handoff_remove']);

          const createTool = findTool(first, 'agent_handoff_create');
          const getTool = findTool(first, 'agent_handoff_get');
          const handoffPacket = {
            schemaVersion: 1,
            id: 'ship-it',
            source: 'release-smoke',
            goal: 'Ship the public release safely.',
          };
          const created = await createTool.execute('smoke-create', handoffPacket, undefined, undefined, ctx);
          assert(joinedText(created).includes('created packet \"ship-it\"'), 'registry Handoff create tool did not create the packet');
          const persisted = first.branch.find((entry) => entry.customType === 'agent-handoff-state');
          assert(
            persisted?.data &&
              Array.isArray(persisted.data.packets) &&
              persisted.data.packets.some((packet) => packet.id === 'ship-it'),
            'registry Handoff state entry did not persist ship-it',
          );

          const listed = await getTool.execute('smoke-get', {}, undefined, undefined, ctx);
          assert(joinedText(listed).includes('ship-it'), 'registry Handoff get tool did not list ship-it');

          const duplicate = await createTool.execute('smoke-duplicate', handoffPacket, undefined, undefined, ctx);
          assert(
            joinedText(duplicate).includes('duplicate packet id \"ship-it\"'),
            'registry Handoff duplicate create did not return the duplicate message',
          );

          const second = createShim(first.branch);
          const ctx2 = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => second.branch },
          };
          const sessionStart = second.handlers.get('session_start');
          assert(typeof sessionStart === 'function', 'registry Handoff session_start handler was not registered');
          await sessionStart({ type: 'session_start' }, ctx2);
          const resumed = await findTool(second, 'agent_handoff_get').execute(
            'smoke-resume',
            {},
            undefined,
            undefined,
            ctx2,
          );
          assert(joinedText(resumed).includes('ship-it'), 'registry Handoff resume did not restore ship-it');

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-handoff-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const extensions = adapterManifest.pi?.extensions;
          assert(Array.isArray(extensions) && extensions.length > 0, 'registry pi.extensions is missing');
          for (const target of extensions) {
            accessSync(new URL(target, adapterManifestUrl));
          }
          const dependency = adapterManifest.dependencies?.['@j1nn0/agent-handoff'];
          assert(
            dependency === `^${process.env.CORE_VERSION}`,
            'registry installed adapter does not depend on the expected core version',
          );
          const dependencyText = JSON.stringify(adapterManifest.dependencies ?? {});
          assert(
            !/(?:workspace:|file:|link:)/.test(dependencyText),
            'registry installed adapter dependencies contain workspace:, file:, or link:',
          );
          const peerDependency = adapterManifest.peerDependencies?.['@earendil-works/pi-coding-agent'];
          assert(
            typeof peerDependency === 'string',
            'registry installed adapter has no Pi peer dependency range',
          );
          console.log(`Installed @earendil-works/pi-coding-agent peer dependency range: ${peerDependency}`);
          console.log('Public registry Handoff consumer smoke passed.');
          NODE
          signature_output_file="$RUNNER_TEMP/npm-audit-signatures"
          if npm audit signatures > "$signature_output_file" 2>&1; then
            cat "$signature_output_file"
          else
            cat "$signature_output_file"
            echo "npm audit signatures failed." >&2
            exit 1
          fi
          if ! grep -Eiq '[1-9][0-9]* packages? (has|have) (a )?verified attestations?' "$signature_output_file"; then
            echo "npm audit signatures reported no verified attestations." >&2
            exit 1
          fi


      - name: Smoke-test Budget on the public registry anonymously
        if: ${{ inputs.family == 'agent-budget' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/registry-consumer"
          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$CORE_PKG_NAME@$CORE_VERSION" "$ADAPTER_PKG_NAME@$PI_VERSION"
          node --input-type=module <<'NODE'
          import { judgeBudget, BudgetError } from '@j1nn0/agent-budget';
          import { deepStrictEqual } from 'node:assert/strict';
          import { accessSync } from 'node:fs';
          import { readFile } from 'node:fs/promises';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          const within = judgeBudget({ consumed: 39, limit: 40 });
          assert(
            within.outcome === 'within_budget' && within.remaining === 1,
            'registry within-budget verdict was incorrect',
          );
          const boundary = judgeBudget({ consumed: 40, limit: 40 });
          assert(
            boundary.outcome === 'exhausted' && boundary.remaining === 0,
            'registry inclusive boundary verdict was incorrect',
          );
          const overage = judgeBudget({ consumed: 41, limit: 40 });
          assert(
            overage.outcome === 'exhausted' && overage.remaining === -1,
            'registry negative overage verdict was incorrect',
          );
          const fractional = judgeBudget({ consumed: 12.483, limit: 20 });
          assert(
            fractional.outcome === 'within_budget' && Math.abs(fractional.remaining - 7.517) < 1e-9,
            'registry fractional verdict was incorrect',
          );
          const zeroLimit = judgeBudget({ consumed: 0, limit: 0 });
          assert(
            zeroLimit.outcome === 'exhausted' && zeroLimit.remaining === 0,
            'registry zero-limit verdict was incorrect',
          );

          let invalidError;
          try {
            judgeBudget({ consumed: 1, limit: 2, extra: true });
          } catch (error) {
            invalidError = error;
          }
          assert(
            invalidError instanceof BudgetError &&
              invalidError.name === 'BudgetError' &&
              invalidError.code === 'invalid_input' &&
              invalidError.message === 'Invalid budget input.',
            'registry invalid input did not throw the expected BudgetError shape',
          );

          const adapterModule = await import('@j1nn0/agent-budget-pi');
          assert(typeof adapterModule.default === 'function', 'registry Pi adapter default export is not a function');

          const createShim = (seed = []) => {
            const handlers = new Map();
            const commands = new Map();
            const tools = [];
            const branch = structuredClone(seed);
            const api = {
              on: (event, handler) => handlers.set(event, handler),
              registerCommand: (name, def) => commands.set(name, def),
              registerTool: (def) => tools.push(def),
              appendEntry: (customType, data) => branch.push({ type: 'custom', customType, data }),
            };
            adapterModule.default(api);
            return { handlers, commands, tools, branch };
          };

          const joinedText = (result) =>
            result.content
              .filter((content) => content.type === 'text')
              .map((content) => content.text)
              .join('');
          const findTool = (shim, name) => {
            const tool = shim.tools.find((candidate) => candidate.name === name);
            assert(tool !== undefined, `registry expected Budget tool was not registered: ${name}`);
            return tool;
          };

          const first = createShim();
          const ctx = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => first.branch },
          };
          const toolNames = first.tools.map((tool) => tool.name).sort();
          deepStrictEqual(
            toolNames,
            ['agent_budget_get', 'agent_budget_judge', 'agent_budget_remove', 'agent_budget_set'],
          );

          const setTool = findTool(first, 'agent_budget_set');
          const getTool = findTool(first, 'agent_budget_get');
          const judgeTool = findTool(first, 'agent_budget_judge');
          const firstBudget = { id: 'first', consumed: 5, limit: 10 };
          const secondBudget = { id: 'second', consumed: 3, limit: 8 };
          const createdFirst = await setTool.execute('registry-first', firstBudget, undefined, undefined, ctx);
          assert(joinedText(createdFirst).includes('created budget "first"'), 'registry first Budget set did not create the record');
          const createdSecond = await setTool.execute('registry-second', secondBudget, undefined, undefined, ctx);
          assert(joinedText(createdSecond).includes('created budget "second"'), 'registry second Budget set did not create the record');
          const stateEntries = () => first.branch.filter((entry) => entry.customType === 'agent-budget-state');
          const persisted = stateEntries().at(-1);
          assert(
            persisted?.data && Array.isArray(persisted.data.budgets),
            'registry Budget state entry did not persist both records',
          );
          deepStrictEqual(persisted.data.budgets, [firstBudget, secondBudget]);

          const replaced = await setTool.execute(
            'registry-replace',
            { id: 'first', consumed: 6, limit: 10 },
            undefined,
            undefined,
            ctx,
          );
          assert(joinedText(replaced).includes('replaced budget "first"'), 'registry Budget replacement message was missing');
          assert(joinedText(replaced).includes('in place'), 'registry Budget replacement was not reported as in place');
          const replacedState = stateEntries().at(-1)?.data;
          assert(replacedState && Array.isArray(replacedState.budgets), 'registry replaced Budget state was not persisted');
          assert(
            replacedState.budgets.length === 2 &&
              replacedState.budgets[0]?.id === 'first' &&
              replacedState.budgets[0]?.consumed === 6 &&
              replacedState.budgets[1]?.id === 'second',
            'registry Budget replacement did not preserve order',
          );

          const stateEntryCount = stateEntries().length;
          const unchanged = await setTool.execute(
            'registry-unchanged',
            { id: 'first', consumed: 6, limit: 10 },
            undefined,
            undefined,
            ctx,
          );
          assert(joinedText(unchanged).includes('unchanged'), 'registry unchanged Budget message was missing');
          assert(joinedText(unchanged).includes('nothing was written'), 'registry unchanged Budget was reported as written');
          assert(stateEntries().length === stateEntryCount, 'registry unchanged Budget set appended a state entry');

          const beforeJudge = stateEntries().length;
          const judged = await judgeTool.execute('registry-judge', {}, undefined, undefined, ctx);
          assert(joinedText(judged).includes('- first: within_budget (remaining 4)'), 'registry Budget judge omitted first verdict');
          assert(joinedText(judged).includes('- second: within_budget (remaining 5)'), 'registry Budget judge omitted second verdict');
          assert(stateEntries().length === beforeJudge, 'registry Budget judge appended a state entry');

          const listed = await getTool.execute('registry-get', {}, undefined, undefined, ctx);
          const listedText = joinedText(listed);
          assert(listedText.indexOf('first') < listedText.indexOf('second'), 'registry Budget get did not preserve insertion order');

          const second = createShim(first.branch);
          const ctx2 = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => second.branch },
          };
          const sessionStart = second.handlers.get('session_start');
          assert(typeof sessionStart === 'function', 'registry Budget session_start handler was not registered');
          await sessionStart({ type: 'session_start' }, ctx2);
          const resumed = await findTool(second, 'agent_budget_get').execute(
            'registry-resume',
            {},
            undefined,
            undefined,
            ctx2,
          );
          const resumedText = joinedText(resumed);
          assert(resumedText.includes('first: consumed=6 limit=10'), 'registry Budget resume lost the replaced value');
          assert(resumedText.includes('second: consumed=3 limit=8'), 'registry Budget resume lost the second record');

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-budget-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const extensions = adapterManifest.pi?.extensions;
          assert(Array.isArray(extensions) && extensions.length > 0, 'registry pi.extensions is missing');
          for (const target of extensions) {
            accessSync(new URL(target, adapterManifestUrl));
          }
          const dependency = adapterManifest.dependencies?.['@j1nn0/agent-budget'];
          assert(
            dependency === `^${process.env.CORE_VERSION}`,
            'registry installed adapter does not depend on the expected core version',
          );
          const dependencyText = JSON.stringify(adapterManifest.dependencies ?? {});
          assert(
            !/(?:workspace:|file:|link:)/.test(dependencyText),
            'registry installed adapter dependencies contain workspace:, file:, or link:',
          );
          const peerDependency = adapterManifest.peerDependencies?.['@earendil-works/pi-coding-agent'];
          assert(
            typeof peerDependency === 'string',
            'registry adapter has no Pi peer dependency range',
          );
          console.log(`Installed @earendil-works/pi-coding-agent peer dependency range: ${peerDependency}`);
          console.log('Public registry Budget consumer smoke passed.');
          NODE
          signature_output_file="$RUNNER_TEMP/npm-audit-signatures"
          if npm audit signatures > "$signature_output_file" 2>&1; then
            cat "$signature_output_file"
          else
            cat "$signature_output_file"
            echo "npm audit signatures failed." >&2
            exit 1
          fi
          if ! grep -Eiq '[1-9][0-9]* packages? (has|have) (a )?verified attestations?' "$signature_output_file"; then
            echo "npm audit signatures reported no verified attestations." >&2
            exit 1
          fi

      - name: Smoke-test Tool Policy on the public registry anonymously
        if: ${{ inputs.family == 'agent-tool-policy' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/registry-consumer"
          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$CORE_PKG_NAME@$CORE_VERSION" "$ADAPTER_PKG_NAME@$PI_VERSION"
          node --input-type=module <<'NODE'
          import { judgeToolPolicy, ToolPolicyError } from '@j1nn0/agent-tool-policy';
          import { deepStrictEqual } from 'node:assert/strict';
          import { accessSync } from 'node:fs';
          import { readFile } from 'node:fs/promises';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          deepStrictEqual(
            judgeToolPolicy({
              tool: 'read',
              policy: { default: 'deny', allow: ['read'], deny: [] },
            }),
            { outcome: 'allowed', source: 'rule' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'bash',
              policy: { default: 'allow', allow: [], deny: ['bash'] },
            }),
            { outcome: 'denied', source: 'rule' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'edit',
              policy: { default: 'deny', allow: [], deny: [], requiresApproval: ['edit'] },
            }),
            { outcome: 'requires_approval', source: 'rule' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'write',
              policy: { default: 'allow', allow: [], deny: [] },
            }),
            { outcome: 'allowed', source: 'default' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'write',
              policy: { default: 'deny', allow: [], deny: [] },
            }),
            { outcome: 'denied', source: 'default' },
          );
          deepStrictEqual(
            judgeToolPolicy({
              tool: 'write',
              policy: { default: 'requires_approval', allow: [], deny: [] },
            }),
            { outcome: 'requires_approval', source: 'default' },
          );

          let invalidError;
          try {
            judgeToolPolicy({ tool: 'bash' });
          } catch (error) {
            invalidError = error;
          }
          assert(
            invalidError instanceof ToolPolicyError &&
              invalidError.name === 'ToolPolicyError' &&
              invalidError.code === 'invalid_input' &&
              invalidError.message === 'Invalid tool policy input.',
            'registry invalid input did not throw the expected ToolPolicyError shape',
          );

          let overlapError;
          try {
            judgeToolPolicy({
              tool: 'tool',
              policy: { default: 'deny', allow: ['tool'], deny: ['tool'] },
            });
          } catch (error) {
            overlapError = error;
          }
          assert(
            overlapError instanceof ToolPolicyError &&
              overlapError.name === 'ToolPolicyError' &&
              overlapError.code === 'invalid_input' &&
              overlapError.message === 'Invalid tool policy input.',
            'registry cross-list overlap did not throw the expected ToolPolicyError shape',
          );

          const adapterModule = await import('@j1nn0/agent-tool-policy-pi');
          const adapterDefault = adapterModule.default;
          assert(typeof adapterDefault === 'function', 'registry installed Pi adapter default export is not a function');

          const createShim = (seed = []) => {
            const handlers = new Map();
            const commands = new Map();
            const tools = [];
            const branch = structuredClone(seed);
            const api = {
              on: (event, handler) => handlers.set(event, handler),
              registerCommand: (name, def) => commands.set(name, def),
              registerTool: (def) => tools.push(def),
              appendEntry: (customType, data) => branch.push({ type: 'custom', customType, data }),
            };
            adapterDefault(api);
            return { handlers, commands, tools, branch };
          };

          const joinedText = (result) =>
            result.content
              .filter((content) => content.type === 'text')
              .map((content) => content.text)
              .join('');

          const first = createShim();
          const ctx = {
            ui: { notify() {} },
            sessionManager: { getBranch: () => first.branch },
          };
          assert(first.commands.has('agent-tool-policy'), 'registry agent-tool-policy command was not registered');
          deepStrictEqual(first.tools, []);

          const toolCall = first.handlers.get('tool_call');
          assert(typeof toolCall === 'function', 'registry tool_call handler was not registered');
          const sessionStart = first.handlers.get('session_start');
          assert(typeof sessionStart === 'function', 'registry session_start handler was not registered');

          const unconfigured = await toolCall(
            { type: 'tool_call', toolName: 'read', toolCallId: 'registry-s1', input: {} },
            ctx,
          );
          assert(
            unconfigured?.block === true &&
              typeof unconfigured.reason === 'string' &&
              unconfigured.reason.includes('no policy configured'),
            'registry unconfigured tool call did not block with the expected reason',
          );

          first.branch.push({
            type: 'custom',
            customType: 'agent-tool-policy-state',
            data: { schemaVersion: 1, policy: { default: 'deny', allow: ['read'], deny: [] } },
          });
          await sessionStart({ type: 'session_start' }, ctx);
          assert(
            (await toolCall({ type: 'tool_call', toolName: 'read', toolCallId: 'registry-s2', input: {} }, ctx)) === undefined,
            'registry allowed tool call was blocked by the configured policy',
          );
          const denied = await toolCall(
            { type: 'tool_call', toolName: 'bash', toolCallId: 'registry-s3', input: {} },
            ctx,
          );
          assert(
            denied?.block === true &&
              typeof denied.reason === 'string' &&
              denied.reason.includes('denied by tool policy'),
            'registry denied tool call did not block with the expected reason',
          );

          first.branch.push({
            type: 'custom',
            customType: 'agent-tool-policy-state',
            data: { schemaVersion: 1, policy: null },
          });
          await sessionStart({ type: 'session_start' }, ctx);
          assert(
            (await toolCall({ type: 'tool_call', toolName: 'bash', toolCallId: 'registry-s4', input: {} }, ctx)) === undefined,
            'registry explicitly disabled policy did not pass the tool call through',
          );

          first.branch.push({
            type: 'custom',
            customType: 'agent-tool-policy-state',
            data: { schemaVersion: 99, policy: 'garbage' },
          });
          await sessionStart({ type: 'session_start' }, ctx);
          const corrupt = await toolCall(
            { type: 'tool_call', toolName: 'read', toolCallId: 'registry-s5', input: {} },
            ctx,
          );
          assert(
            corrupt?.block === true &&
              typeof corrupt.reason === 'string' &&
              corrupt.reason.includes('policy configuration'),
            'registry corrupt newest policy did not block with a configuration reason',
          );

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-tool-policy-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const dependency = adapterManifest.dependencies?.['@j1nn0/agent-tool-policy'];
          assert(
            dependency === `^${process.env.CORE_VERSION}`,
            'registry installed adapter does not depend on the expected core version',
          );
          const dependencyText = JSON.stringify(adapterManifest.dependencies ?? {});
          assert(
            !/(?:workspace:|file:|link:)/.test(dependencyText),
            'registry installed adapter dependencies contain workspace:, file:, or link:',
          );
          const extensions = adapterManifest.pi?.extensions;
          assert(Array.isArray(extensions) && extensions.length > 0, 'registry pi.extensions is missing');
          for (const target of extensions) {
            accessSync(new URL(target, adapterManifestUrl));
          }
          const peerDependency = adapterManifest.peerDependencies?.['@earendil-works/pi-coding-agent'];
          assert(
            typeof peerDependency === 'string',
            'registry adapter has no Pi peer dependency range',
          );
          console.log(`Installed @earendil-works/pi-coding-agent peer dependency range: ${peerDependency}`);
          console.log('Public registry Tool Policy consumer smoke passed.');
          NODE
          signature_output_file="$RUNNER_TEMP/npm-audit-signatures"
          if npm audit signatures > "$signature_output_file" 2>&1; then
            cat "$signature_output_file"
          else
            cat "$signature_output_file"
            echo "npm audit signatures failed." >&2
            exit 1
          fi
          if ! grep -Eiq '[1-9][0-9]* packages? (has|have) (a )?verified attestations?' "$signature_output_file"; then
            echo "npm audit signatures reported no verified attestations." >&2
            exit 1
          fi

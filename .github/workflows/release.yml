      - name: Record Node and npm versions for trusted publishing
        if: ${{ steps.registry_preflight.outputs.publish_core == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Publish core
        if: ${{ steps.registry_preflight.outputs.publish_core == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm publish "${{ steps.validated_tarballs.outputs.core_tarball }}" --access public --provenance

      - name: Verify core on the registry before the adapter
        if: ${{ success() && steps.registry_preflight.outputs.publish_adapter == 'true' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
        shell: bash
        run: |
          set -euo pipefail
          verification_file="$RUNNER_TEMP/core-registry-verification"
          verification_error_file="$RUNNER_TEMP/core-registry-verification.err"
          rm -f "$verification_file" "$verification_error_file"
          max_attempts=40
          retry_delay=15
          core_visible=false
          for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
            if npm view "$CORE_PKG_NAME@$CORE_VERSION" name version repository --prefer-online --json > "$verification_file" 2> "$verification_error_file"; then
              core_visible=true
              break
            fi
            if (( attempt < max_attempts )); then
              echo "Waiting for $CORE_PKG_NAME@$CORE_VERSION on the public registry (attempt $attempt/$max_attempts); retrying in ${retry_delay}s."
              sleep "$retry_delay"
            fi
          done
          if [[ "$core_visible" != true ]]; then
            echo "Core registry verification failed; the adapter will not be published. The version did not become visible on the public registry within the wait window." >&2
            cat "$verification_error_file" >&2
            exit 1
          fi
          python3 - "$verification_file" "$CORE_VERSION" "$CORE_PKG_NAME" <<'PY'
          import json
          import sys

          expected_package_name = sys.argv[3]
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          if isinstance(data, list):
              if len(data) != 1:
                  raise SystemExit("Core registry verification returned an unexpected list.")
              data = data[0]
          if not isinstance(data, dict):
              raise SystemExit("Core registry verification returned no manifest object.")
          if data.get("name") != expected_package_name:
              raise SystemExit("Core registry verification returned an unexpected package name.")
          if data.get("version") != sys.argv[2]:
              raise SystemExit("Core registry verification returned an unexpected version.")
          repository_text = json.dumps(data.get("repository"), sort_keys=True)
          if "j1nn0/agent-primitives" not in repository_text:
              raise SystemExit("Core registry verification returned an unexpected repository.")
          print("Core registry verification passed.")
          PY

      - name: Verify core provenance attestation before the adapter
        if: ${{ success() && steps.registry_preflight.outputs.publish_adapter == 'true' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          attestation_url="https://registry.npmjs.org/-/npm/v1/attestations/${CORE_PKG_NAME/\//%2F}@$CORE_VERSION"
          attestation_file="$RUNNER_TEMP/core-provenance-attestation"
          rm -f "$attestation_file"
          max_attempts=40
          retry_delay=15
          core_attestation_visible=false
          core_attestation_status=""
          for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
            core_attestation_status="$(
              curl --silent --show-error --location \
                --output "$attestation_file" \
                --write-out '%{http_code}' \
                "$attestation_url" 2>/dev/null || true
            )"
            if [[ "$core_attestation_status" == "200" ]] && python3 - "$attestation_file" <<'PY'
          import base64
          import json
          import os
          import sys

          required = {
              "https://github.com/npm/attestation/tree/main/specs/publish/v0.1",
              "https://slsa.dev/provenance/v1",
          }
          with open(sys.argv[1], encoding="utf-8") as handle:
              body = json.load(handle)
          attestations = body.get("attestations") if isinstance(body, dict) else None
          if not isinstance(attestations, list):
              raise SystemExit("attestation response has no attestations list")

          predicate_types = set()

          def collect(value):
              if isinstance(value, dict):
                  for key, nested in value.items():
                      if key == "predicateType" and isinstance(nested, str):
                          predicate_types.add(nested)
                      elif key == "predicateTypes" and isinstance(nested, list):
                          predicate_types.update(item for item in nested if isinstance(item, str))
                      collect(nested)
              elif isinstance(value, list):
                  for nested in value:
                      collect(nested)

          for attestation in attestations:
              collect(attestation)
          missing = required - predicate_types
          if missing:
              raise SystemExit(f"attestation response is missing predicate types: {sorted(missing)}")

          slsa_statement = None
          for attestation in attestations:
              if not isinstance(attestation, dict):
                  continue
              bundle = attestation.get("bundle")
              if not isinstance(bundle, dict):
                  continue
              dsse_envelope = bundle.get("dsseEnvelope")
              if not isinstance(dsse_envelope, dict):
                  continue
              payload = dsse_envelope.get("payload")
              if not isinstance(payload, str):
                  continue
              try:
                  decoded_payload = base64.b64decode(payload, validate=True)
                  statement = json.loads(decoded_payload)
              except (ValueError, UnicodeDecodeError):
                  continue
              if (
                  isinstance(statement, dict)
                  and statement.get("predicateType") == "https://slsa.dev/provenance/v1"
                  and isinstance(statement.get("predicate"), dict)
              ):

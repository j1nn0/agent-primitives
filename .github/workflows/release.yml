name: Release

on:
  workflow_dispatch:
    inputs:
      family:
        description: Package family to release
        required: true
        default: context-guard
        type: choice
        options:
          - context-guard
          - agent-state
          - agent-progress
      mode:
        description: Release mode
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish
      core_version:
        description: Version of the core package of the selected family to release
        required: true
        default: 0.1.1
        type: string
      pi_version:
        description: Version of the Pi adapter package of the selected family to release
        required: true
        default: 0.1.1
        type: string
      confirmation:
        description: 'Required in publish mode: publish-<family>-<core_version>-<pi_version>'
        required: false
        default: ''
        type: string
      allow_existing_core:
        description: Allow partial recovery when the requested core version already exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CORE_PKG_NAME: ${{ inputs.family == 'agent-progress' && '@j1nn0/agent-progress' || inputs.family == 'agent-state' && '@j1nn0/agent-state' || '@j1nn0/agent-context-guard' }}
      ADAPTER_PKG_NAME: ${{ inputs.family == 'agent-progress' && '@j1nn0/agent-progress-pi' || inputs.family == 'agent-state' && '@j1nn0/agent-state-pi' || '@j1nn0/agent-context-guard-pi' }}
      CORE_PKG_DIR: ${{ inputs.family == 'agent-progress' && 'packages/agent-progress' || inputs.family == 'agent-state' && 'packages/agent-state' || 'packages/context-guard' }}
      ADAPTER_PKG_DIR: ${{ inputs.family == 'agent-progress' && 'packages/agent-progress-pi' || inputs.family == 'agent-state' && 'packages/agent-state-pi' || 'packages/context-guard-pi' }}
      CORE_TARBALL_BASE: ${{ inputs.family == 'agent-progress' && 'j1nn0-agent-progress' || inputs.family == 'agent-state' && 'j1nn0-agent-state' || 'j1nn0-agent-context-guard' }}
      ADAPTER_TARBALL_BASE: ${{ inputs.family == 'agent-progress' && 'j1nn0-agent-progress-pi' || inputs.family == 'agent-state' && 'j1nn0-agent-state-pi' || 'j1nn0-agent-context-guard-pi' }}
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate release inputs and manifests
        env:
          FAMILY: ${{ inputs.family }}
          MODE: ${{ inputs.mode }}
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail

          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$CORE_VERSION" =~ $version_pattern ]]; then
            echo "Invalid core_version: must be a semantic version without a leading v." >&2
            exit 1
          fi
          if [[ ! "$PI_VERSION" =~ $version_pattern ]]; then
            echo "Invalid pi_version: must be a semantic version without a leading v." >&2
            exit 1
          fi

          manifest_core_version="$(node -p "JSON.parse(require('node:fs').readFileSync('$CORE_PKG_DIR/package.json', 'utf8')).version")"
          manifest_pi_version="$(node -p "JSON.parse(require('node:fs').readFileSync('$ADAPTER_PKG_DIR/package.json', 'utf8')).version")"
          if [[ "$CORE_VERSION" != "$manifest_core_version" ]]; then
            echo "core_version $CORE_VERSION does not match $CORE_PKG_DIR/package.json ($manifest_core_version)." >&2
            exit 1
          fi
          if [[ "$PI_VERSION" != "$manifest_pi_version" ]]; then
            echo "pi_version $PI_VERSION does not match $ADAPTER_PKG_DIR/package.json ($manifest_pi_version)." >&2
            exit 1
          fi

          case "$MODE" in
            validate|publish)
              ;;
            *)
              echo "Invalid mode: expected validate or publish." >&2
              exit 1
              ;;
          esac

          if [[ "$MODE" == "publish" ]]; then
            expected_confirmation="publish-${FAMILY}-${CORE_VERSION}-${PI_VERSION}"
            if [[ "$CONFIRMATION" != "$expected_confirmation" ]]; then
              echo "Invalid confirmation. Expected exactly: $expected_confirmation" >&2
              exit 1
            fi
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build from a clean dist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CORE_PKG_DIR/dist" "$ADAPTER_PKG_DIR/dist"
          pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check package quality
        run: pnpm check:package

      - name: Run example
        run: pnpm example

      - name: Dry-run pnpm package publication
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter "$CORE_PKG_NAME" publish --dry-run --access public --no-git-checks
          pnpm --filter "$ADAPTER_PKG_NAME" publish --dry-run --access public --no-git-checks

      - name: Pack release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release-artifacts"
          mkdir -p "$RUNNER_TEMP/release-artifacts"
          pnpm --filter "$CORE_PKG_NAME" pack --pack-destination "$RUNNER_TEMP/release-artifacts"
          pnpm --filter "$ADAPTER_PKG_NAME" pack --pack-destination "$RUNNER_TEMP/release-artifacts"

      - name: Extract and audit release artifacts
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          audit_dir="$RUNNER_TEMP/release-audit"
          core_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$CORE_TARBALL_BASE-*.tgz" ! -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          pi_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          if [[ -z "$core_tarball" || -z "$pi_tarball" ]]; then
            echo "Could not locate both packed release tarballs." >&2
            exit 1
          fi

          rm -rf "$audit_dir"
          mkdir -p "$audit_dir/core" "$audit_dir/pi"
          tar -xzf "$core_tarball" -C "$audit_dir/core"
          tar -xzf "$pi_tarball" -C "$audit_dir/pi"

          python3 - "$core_tarball" "$pi_tarball" "$audit_dir" "$CORE_VERSION" "$PI_VERSION" "$CORE_PKG_NAME" "$ADAPTER_PKG_NAME" <<'PY'
          import json
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          core_tarball = Path(sys.argv[1])
          pi_tarball = Path(sys.argv[2])
          audit_dir = Path(sys.argv[3])
          core_version = sys.argv[4]
          pi_version = sys.argv[5]
          core_package_name = sys.argv[6]
          adapter_package_name = sys.argv[7]

          expected = {
              core_tarball: (
                  audit_dir / "core",
                  core_package_name,
                  core_version,
              ),
              pi_tarball: (
                  audit_dir / "pi",
                  adapter_package_name,
                  pi_version,
              ),
          }
          forbidden_parts = {"test", "tests", "benchmark", "benchmarks", ".git", ".npmrc"}

          def fail(message: str) -> None:
              raise SystemExit(f"Artifact audit failed: {message}")

          for archive, (extracted_root, expected_name, expected_version) in expected.items():
              with tarfile.open(archive, "r:gz") as tar:
                  members = tar.getmembers()
                  names = {member.name.rstrip("/") for member in members}
                  manifest_member = next(
                      (member for member in members if member.name.rstrip("/") == "package/package.json"),
                      None,
                  )
                  if manifest_member is None:
                      fail(f"{archive.name} has no package/package.json")
                  manifest_data = tar.extractfile(manifest_member)
                  if manifest_data is None:
                      fail(f"{archive.name} package manifest cannot be read")
                  try:
                      manifest = json.load(manifest_data)
                  except json.JSONDecodeError as error:
                      fail(f"{archive.name} has invalid package.json: {error}")

                  if manifest.get("name") != expected_name:
                      fail(f"{archive.name} has unexpected package name")
                  if manifest.get("version") != expected_version:
                      fail(f"{archive.name} has unexpected package version")
                  if "package/LICENSE" not in names:
                      fail(f"{archive.name} is missing LICENSE")
                  if "package/README.md" not in names:
                      fail(f"{archive.name} is missing README.md")
                  if not any(name == "package/dist" or name.startswith("package/dist/") for name in names):
                      fail(f"{archive.name} is missing dist/")

                  for name in names:
                      parts = PurePosixPath(name).parts
                      if any(part in forbidden_parts for part in parts) or name.endswith(".tgz") or "/home/" in name:
                          fail(f"{archive.name} contains forbidden path {name}")

                  for member in members:
                      if not member.isfile():
                          continue
                      content = tar.extractfile(member)
                      if content is not None and b"/home/" in content.read():
                          fail(f"{archive.name} contains /home/ in {member.name}")

              extracted_manifest_path = extracted_root / "package/package.json"
              try:
                  extracted_manifest = json.loads(extracted_manifest_path.read_text())
              except (OSError, json.JSONDecodeError) as error:
                  fail(f"cannot read extracted manifest from {archive.name}: {error}")
              if extracted_manifest.get("name") != expected_name:
                  fail(f"extracted {archive.name} manifest has unexpected package name")

              if expected_name == adapter_package_name:
                  dependencies = extracted_manifest.get("dependencies")
                  if not isinstance(dependencies, dict):
                      fail("adapter packed manifest has no dependencies object")
                  dependency_text = json.dumps(dependencies, sort_keys=True)
                  if "workspace:" in dependency_text:
                      fail("adapter packed dependencies contain workspace:")
                  expected_dependency = f"^{core_version}"
                  actual_dependency = dependencies.get(core_package_name)
                  if actual_dependency != expected_dependency:
                      fail(
                          f"adapter packed dependency on {core_package_name} "
                          f"is {actual_dependency!r}, expected {expected_dependency!r}"
                      )

                  pi_manifest = extracted_manifest.get("pi")
                  extensions = pi_manifest.get("extensions") if isinstance(pi_manifest, dict) else None
                  if not isinstance(extensions, list) or not extensions:
                      fail("adapter packed manifest has no pi.extensions entry")
                  for target in extensions:
                      if not isinstance(target, str) or target.startswith("/"):
                          fail(f"adapter pi.extensions target is invalid: {target!r}")
                      target_path = target[2:] if target.startswith("./") else target
                      if not target_path or f"package/{target_path}" not in names:
                          fail(f"adapter pi.extensions target is missing: {target!r}")

          print("Release artifacts passed manifest, contents, extension, and path audits.")
          PY

      - name: Smoke-test Context Guard packed artifacts in a fresh consumer
        if: ${{ inputs.family == 'context-guard' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          consumer_dir="$RUNNER_TEMP/release-consumer"
          core_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$CORE_TARBALL_BASE-*.tgz" ! -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          pi_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          if [[ -z "$core_tarball" || -z "$pi_tarball" ]]; then
            echo "Could not locate both packed release tarballs for the consumer smoke test." >&2
            exit 1
          fi

          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$core_tarball" "$pi_tarball"
          node --input-type=module <<'NODE'
          import { createContextGuard, createLiteralVerifier } from '@j1nn0/agent-context-guard';
          import { access, readFile } from 'node:fs/promises';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          const guard = createContextGuard();
          guard.add({
            id: 'goal',
            kind: 'goal',
            content: 'Ship the release safely.',
          });
          guard.add({
            id: 'critical-constraint',
            kind: 'constraint',
            content: 'Verify the core before the adapter.',
            critical: true,
          });
          const snapshot = guard.snapshot();
          assert(snapshot.items.length === 2, 'snapshot did not contain both items');

          const report = await guard.verify('Ship the release safely.', {
            verifier: createLiteralVerifier(),
          });
          assert(report.ok === false, 'missing critical context was reported as okay');
          assert(report.lost.includes('critical-constraint'), 'critical item was not reported lost');
          assert(
            report.criticalFailures.includes('critical-constraint'),
            'missing critical item was not reported as a critical failure',
          );

          const adapter = await import('@j1nn0/agent-context-guard-pi');
          assert(typeof adapter.default === 'function', 'Pi adapter default export is not a function');

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-context-guard-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const extensions = adapterManifest.pi?.extensions;
          assert(Array.isArray(extensions) && extensions.length > 0, 'pi.extensions is missing');
          for (const target of extensions) {
            await access(new URL(target, adapterManifestUrl));
          }
          console.log('Packed artifact consumer smoke passed.');
          NODE

      - name: Smoke-test Agent State packed artifacts in a fresh consumer
        if: ${{ inputs.family == 'agent-state' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          consumer_dir="$RUNNER_TEMP/release-consumer"
          core_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$CORE_TARBALL_BASE-*.tgz" ! -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          pi_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          if [[ -z "$core_tarball" || -z "$pi_tarball" ]]; then
            echo "Could not locate both packed release tarballs for the consumer smoke test." >&2
            exit 1
          fi

          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$core_tarball" "$pi_tarball"
          node --input-type=module <<'NODE'
          import {
            createAgentState,
            restoreAgentState,
            summarizeAgentState,
          } from '@j1nn0/agent-state';
          import { access, readFile } from 'node:fs/promises';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          const state = createAgentState({ objective: 'Ship the release safely.' });
          state.addWorkItem({ id: 'release', content: 'Publish the release.' });
          state.setWorkItemStatus('release', 'done');
          state.addDecision({ id: 'ordering', content: 'Publish the core before the adapter.' });
          const snapshot = state.snapshot();
          assert(snapshot.schemaVersion === 1, 'snapshot has an unexpected schema version');
          assert(snapshot.workItems.length === 1, 'snapshot did not contain the work item');
          assert(snapshot.workItems[0].status === 'done', 'work item status was not updated');
          assert(snapshot.decisions.length === 1, 'snapshot did not contain the decision');

          const summary = summarizeAgentState(snapshot);
          assert(
            summary.open === 0 &&
              summary.in_progress === 0 &&
              summary.blocked === 0 &&
              summary.done === 1 &&
              summary.total === 1,
            'Agent State summary counts were incorrect',
          );
          const restored = restoreAgentState(snapshot);
          assert(
            JSON.stringify(restored.snapshot()) === JSON.stringify(snapshot),
            'Agent State restore did not preserve the snapshot',
          );

          const adapter = await import('@j1nn0/agent-state-pi');
          assert(typeof adapter.default === 'function', 'Pi adapter default export is not a function');

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-state-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const extensions = adapterManifest.pi?.extensions;
          assert(Array.isArray(extensions) && extensions.length > 0, 'pi.extensions is missing');
          for (const target of extensions) {
            await access(new URL(target, adapterManifestUrl));
          }
          const dependency = adapterManifest.dependencies?.['@j1nn0/agent-state'];
          assert(
            dependency === `^${process.env.CORE_VERSION}`,
            'packed adapter does not depend on the expected core version',
          );
          assert(
            !JSON.stringify(adapterManifest.dependencies ?? {}).includes('workspace:'),
            'packed adapter dependencies contain workspace:',
          );
          console.log('Agent State packed artifact consumer smoke passed.');
          NODE

      - name: Smoke-test Progress packed artifacts in a fresh consumer
        if: ${{ inputs.family == 'agent-progress' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          consumer_dir="$RUNNER_TEMP/release-consumer"
          core_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$CORE_TARBALL_BASE-*.tgz" ! -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          pi_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          if [[ -z "$core_tarball" || -z "$pi_tarball" ]]; then
            echo "Could not locate both packed release tarballs for the consumer smoke test." >&2
            exit 1
          fi

          rm -rf "$consumer_dir"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$core_tarball" "$pi_tarball"
          node --input-type=module <<'NODE'
          import { judgeProgress, ProgressError } from '@j1nn0/agent-progress';
          import { access, readFile } from 'node:fs/promises';

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          assert(typeof ProgressError === 'function', 'ProgressError export is not a constructor');

          const first = judgeProgress({ current: { milestones: ['planned'] } });
          assert(first.outcome === 'unknown', 'first progress judgment was not unknown');
          assert(first.reason === 'missing_baseline', 'first progress judgment had the wrong unknown reason');

          const baseline = { milestones: first.recordedMilestones };
          const progress = judgeProgress({
            previous: baseline,
            current: { milestones: ['planned', 'implemented'] },
          });
          assert(progress.outcome === 'progress', 'new milestone was not reported as progress');
          assert(
            JSON.stringify(progress.newMilestones) === JSON.stringify(['implemented']),
            'new milestone list was incorrect',
          );

          const cumulative = { milestones: progress.recordedMilestones };
          const redeclared = judgeProgress({
            previous: cumulative,
            current: { milestones: ['planned', 'implemented'] },
          });
          assert(redeclared.outcome === 'no_progress', 'redeclaring the same set reported progress');

          const withdrawn = judgeProgress({
            previous: cumulative,
            current: { milestones: ['implemented'] },
          });
          assert(withdrawn.outcome === 'no_progress', 'withdrawal-only change reported progress');
          assert(
            JSON.stringify(withdrawn.withdrawnMilestones) === JSON.stringify(['planned']),
            'withdrawn milestone list was incorrect',
          );

          const reintroduced = judgeProgress({
            previous: { milestones: withdrawn.recordedMilestones },
            current: { milestones: ['implemented', 'planned'] },
          });
          assert(
            reintroduced.outcome === 'no_progress',
            'withdrawn-then-redeclared milestone reported progress',
          );

          const adapter = await import('@j1nn0/agent-progress-pi');
          assert(typeof adapter.default === 'function', 'Pi adapter default export is not a function');

          const adapterManifestUrl = new URL(
            import.meta.resolve('@j1nn0/agent-progress-pi/package.json'),
          );
          const adapterManifest = JSON.parse(await readFile(adapterManifestUrl, 'utf8'));
          const extensions = adapterManifest.pi?.extensions;
          assert(Array.isArray(extensions) && extensions.length > 0, 'pi.extensions is missing');
          for (const target of extensions) {
            await access(new URL(target, adapterManifestUrl));
          }
          const dependency = adapterManifest.dependencies?.['@j1nn0/agent-progress'];
          assert(
            dependency === `^${process.env.CORE_VERSION}`,
            'packed adapter does not depend on the expected core version',
          );
          assert(
            !JSON.stringify(adapterManifest.dependencies ?? {}).includes('workspace:'),
            'packed adapter dependencies contain workspace:',
          );
          console.log('Progress packed artifact consumer smoke passed.');
          NODE

  publish:
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.mode == 'publish' }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      CORE_PKG_NAME: ${{ inputs.family == 'agent-progress' && '@j1nn0/agent-progress' || inputs.family == 'agent-state' && '@j1nn0/agent-state' || '@j1nn0/agent-context-guard' }}
      ADAPTER_PKG_NAME: ${{ inputs.family == 'agent-progress' && '@j1nn0/agent-progress-pi' || inputs.family == 'agent-state' && '@j1nn0/agent-state-pi' || '@j1nn0/agent-context-guard-pi' }}
      CORE_PKG_DIR: ${{ inputs.family == 'agent-progress' && 'packages/agent-progress' || inputs.family == 'agent-state' && 'packages/agent-state' || 'packages/context-guard' }}
      ADAPTER_PKG_DIR: ${{ inputs.family == 'agent-progress' && 'packages/agent-progress-pi' || inputs.family == 'agent-state' && 'packages/agent-state-pi' || 'packages/context-guard-pi' }}
      CORE_TARBALL_BASE: ${{ inputs.family == 'agent-progress' && 'j1nn0-agent-progress' || inputs.family == 'agent-state' && 'j1nn0-agent-state' || 'j1nn0-agent-context-guard' }}
      ADAPTER_TARBALL_BASE: ${{ inputs.family == 'agent-progress' && 'j1nn0-agent-progress-pi' || inputs.family == 'agent-state' && 'j1nn0-agent-state-pi' || 'j1nn0-agent-context-guard-pi' }}
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard that the dispatch ref is main
        env:
          DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Release publishing is allowed only from refs/heads/main; got $DISPATCH_REF." >&2
            exit 1
          fi

      - name: Guard that main has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          checked_out_commit="$(git rev-parse HEAD)"
          remote_main_commit="$(git rev-parse origin/main)"
          if [[ "$checked_out_commit" != "$remote_main_commit" ]]; then
            echo "main advanced after dispatch; re-dispatch the release from the current main commit." >&2
            exit 1
          fi

      - name: Guard that the checkout is clean
        shell: bash
        run: |
          set -euo pipefail
          tree_status="$(git status --porcelain)"
          if [[ -n "$tree_status" ]]; then
            echo "The checked-out release tree is not clean:" >&2
            printf '%s\n' "$tree_status" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build from a clean dist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CORE_PKG_DIR/dist" "$ADAPTER_PKG_DIR/dist"
          pnpm build

      - name: Re-assert manifest versions
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_core_version="$(node -p "JSON.parse(require('node:fs').readFileSync('$CORE_PKG_DIR/package.json', 'utf8')).version")"
          manifest_pi_version="$(node -p "JSON.parse(require('node:fs').readFileSync('$ADAPTER_PKG_DIR/package.json', 'utf8')).version")"
          if [[ "$CORE_VERSION" != "$manifest_core_version" ]]; then
            echo "core_version no longer matches the core manifest." >&2
            exit 1
          fi
          if [[ "$PI_VERSION" != "$manifest_pi_version" ]]; then
            echo "pi_version no longer matches the Pi adapter manifest." >&2
            exit 1
          fi

      - name: Pack and audit publish artifacts
        id: publish_artifacts
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/publish-artifacts"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          pnpm --filter "$CORE_PKG_NAME" pack --pack-destination "$artifact_dir"
          pnpm --filter "$ADAPTER_PKG_NAME" pack --pack-destination "$artifact_dir"
          core_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$CORE_TARBALL_BASE-*.tgz" ! -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          pi_tarball="$(find "$artifact_dir" -maxdepth 1 -type f -name "$ADAPTER_TARBALL_BASE-*.tgz" -print -quit)"
          if [[ -z "$core_tarball" || -z "$pi_tarball" ]]; then
            echo "Could not locate both pre-publish release tarballs." >&2
            exit 1
          fi
          python3 - "$core_tarball" "$pi_tarball" "$CORE_VERSION" "$PI_VERSION" "$CORE_PKG_NAME" "$ADAPTER_PKG_NAME" <<'PY'
          import json
          import sys
          import tarfile
          from pathlib import PurePosixPath

          core_tarball = sys.argv[1]
          pi_tarball = sys.argv[2]
          core_version = sys.argv[3]
          pi_version = sys.argv[4]
          core_package_name = sys.argv[5]
          adapter_package_name = sys.argv[6]

          expected = {
              core_tarball: (core_package_name, core_version),
              pi_tarball: (adapter_package_name, pi_version),
          }
          forbidden_parts = {"test", "tests", "benchmark", "benchmarks", ".git", ".npmrc"}

          def fail(message: str) -> None:
              raise SystemExit(f"Pre-publish artifact audit failed: {message}")

          audits = {}
          for archive, (expected_name, expected_version) in expected.items():
              with tarfile.open(archive, "r:gz") as tar:
                  members = tar.getmembers()
                  names = {member.name.rstrip("/") for member in members}
                  manifest_member = next(
                      (member for member in members if member.name.rstrip("/") == "package/package.json"),
                      None,
                  )
                  if manifest_member is None:
                      fail(f"{archive} has no package/package.json")
                  manifest_data = tar.extractfile(manifest_member)
                  if manifest_data is None:
                      fail(f"{archive} package manifest cannot be read")
                  try:
                      manifest = json.load(manifest_data)
                  except json.JSONDecodeError as error:
                      fail(f"{archive} has invalid package.json: {error}")

                  if manifest.get("name") != expected_name:
                      fail(f"{archive} has unexpected package name")
                  if manifest.get("version") != expected_version:
                      fail(f"{archive} has unexpected package version")
                  if "package/LICENSE" not in names:
                      fail(f"{archive} is missing LICENSE")
                  if "package/README.md" not in names:
                      fail(f"{archive} is missing README.md")
                  if not any(name == "package/dist" or name.startswith("package/dist/") for name in names):
                      fail(f"{archive} is missing dist/")
                  if not any(name == "package/src" or name.startswith("package/src/") for name in names):
                      fail(f"{archive} is missing src/")

                  for name in names:
                      parts = PurePosixPath(name).parts
                      if any(part in forbidden_parts for part in parts) or name.endswith(".tgz") or "/home/" in name:
                          fail(f"{archive} contains forbidden path {name}")
                  for member in members:
                      if not member.isfile():
                          continue
                      content = tar.extractfile(member)
                      if content is not None and b"/home/" in content.read():
                          fail(f"{archive} contains /home/ in {member.name}")

              audits[archive] = (manifest, names)

          adapter_manifest, adapter_names = audits[pi_tarball]
          dependencies = adapter_manifest.get("dependencies")
          if not isinstance(dependencies, dict):
              fail("adapter packed manifest has no dependencies object")
          dependency_text = json.dumps(dependencies, sort_keys=True)
          if "workspace:" in dependency_text:
              fail("adapter packed dependencies contain workspace:")
          expected_dependency = f"^{core_version}"
          actual_dependency = dependencies.get(core_package_name)
          if actual_dependency != expected_dependency:
              fail(
                  f"adapter packed dependency on {core_package_name} "
                  f"is {actual_dependency!r}, expected {expected_dependency!r}"
              )

          pi_manifest = adapter_manifest.get("pi")
          extensions = pi_manifest.get("extensions") if isinstance(pi_manifest, dict) else None
          if not isinstance(extensions, list) or not extensions:
              fail("adapter packed manifest has no pi.extensions entry")
          for target in extensions:
              if not isinstance(target, str) or target.startswith("/"):
                  fail(f"adapter pi.extensions target is invalid: {target!r}")
              target_path = target[2:] if target.startswith("./") else target
              if not target_path or f"package/{target_path}" not in adapter_names:
                  fail(f"adapter pi.extensions target is missing: {target!r}")

          print("Pre-publish artifacts passed manifest, contents, dependency, extension, and path audits.")
          PY
          printf 'core_tarball=%s\n' "$core_tarball" >> "$GITHUB_OUTPUT"
          printf 'pi_tarball=%s\n' "$pi_tarball" >> "$GITHUB_OUTPUT"

      - name: Registry preflight
        id: registry_preflight
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
          ALLOW_EXISTING_CORE: ${{ inputs.allow_existing_core }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ALLOW_EXISTING_CORE" in
            true|false)
              ;;
            *)
              echo "allow_existing_core must be a boolean input." >&2
              exit 1
              ;;
          esac

          core_view_file="$RUNNER_TEMP/core-registry-view"
          adapter_view_file="$RUNNER_TEMP/adapter-registry-view"
          rm -f "$core_view_file" "$adapter_view_file"

          core_exists=false
          if npm view "$CORE_PKG_NAME@$CORE_VERSION" --json > "$core_view_file" 2>&1; then
            core_exists=true
          fi
          adapter_exists=false
          if npm view "$ADAPTER_PKG_NAME@$PI_VERSION" --json > "$adapter_view_file" 2>&1; then
            adapter_exists=true
          fi

          if [[ "$core_exists" == false && "$adapter_exists" == false ]]; then
            state='A'
          elif [[ "$core_exists" == true && "$adapter_exists" == false ]]; then
            state='B'
          elif [[ "$core_exists" == false && "$adapter_exists" == true ]]; then
            state='C'
          else
            state='D'
          fi

          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          printf 'core_exists=%s\n' "$core_exists" >> "$GITHUB_OUTPUT"
          printf 'adapter_exists=%s\n' "$adapter_exists" >> "$GITHUB_OUTPUT"

          case "$state" in
            A)
              printf 'publish_core=true\n' >> "$GITHUB_OUTPUT"
              printf 'publish_adapter=true\n' >> "$GITHUB_OUTPUT"
              echo "Registry state A: neither requested version exists; core then adapter will be published."
              ;;
            B)
              if [[ "$ALLOW_EXISTING_CORE" != true ]]; then
                printf 'publish_core=false\n' >> "$GITHUB_OUTPUT"
                printf 'publish_adapter=false\n' >> "$GITHUB_OUTPUT"
                echo "Core version already exists while the adapter version does not. Re-dispatch with allow_existing_core=true for deliberate partial recovery." >&2
                exit 1
              fi

              core_identity_file="$RUNNER_TEMP/core-registry-identity"
              core_identity_error_file="$RUNNER_TEMP/core-registry-identity.err"
              rm -f "$core_identity_file" "$core_identity_error_file"
              max_attempts=40
              retry_delay=15
              core_identity_visible=false
              for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
                if npm view "$CORE_PKG_NAME@$CORE_VERSION" name version repository --prefer-online --json > "$core_identity_file" 2> "$core_identity_error_file"; then
                  core_identity_visible=true
                  break
                fi
                if (( attempt < max_attempts )); then
                  echo "Waiting for $CORE_PKG_NAME@$CORE_VERSION on the public registry (attempt $attempt/$max_attempts); retrying in ${retry_delay}s."
                  sleep "$retry_delay"
                fi
              done
              if [[ "$core_identity_visible" != true ]]; then
                echo "Existing core could not be verified; refusing partial recovery. The version did not become visible on the public registry within the wait window." >&2
                cat "$core_identity_error_file" >&2
                exit 1
              fi
              python3 - "$core_identity_file" "$CORE_VERSION" "$CORE_PKG_NAME" <<'PY'
          import json
          import sys

          expected_package_name = sys.argv[3]
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          if isinstance(data, list):
              if len(data) != 1:
                  raise SystemExit("Existing core verification returned an unexpected list.")
              data = data[0]
          if not isinstance(data, dict):
              raise SystemExit("Existing core verification returned no manifest object.")
          if data.get("name") != expected_package_name:
              raise SystemExit("Existing core has an unexpected package name.")
          if data.get("version") != sys.argv[2]:
              raise SystemExit("Existing core has an unexpected version.")
          repository_text = json.dumps(data.get("repository"), sort_keys=True)
          if "j1nn0/agent-primitives" not in repository_text:
              raise SystemExit("Existing core repository does not identify j1nn0/agent-primitives.")
          print("Existing core identity and repository verified for partial recovery.")
          PY
              printf 'publish_core=false\n' >> "$GITHUB_OUTPUT"
              printf 'publish_adapter=true\n' >> "$GITHUB_OUTPUT"
              echo "Registry state B: verified existing core; only the adapter will be published."
              ;;
            C)
              printf 'publish_core=false\n' >> "$GITHUB_OUTPUT"
              printf 'publish_adapter=false\n' >> "$GITHUB_OUTPUT"
              echo "Registry state C: the adapter version exists but the core version does not. This inconsistent registry state will not be repaired automatically." >&2
              echo "Core npm view output:" >&2
              cat "$core_view_file" >&2
              echo "Adapter npm view output:" >&2
              cat "$adapter_view_file" >&2
              exit 1
              ;;
            D)
              printf 'publish_core=false\n' >> "$GITHUB_OUTPUT"
              printf 'publish_adapter=false\n' >> "$GITHUB_OUTPUT"
              echo "Registry state D: both requested versions already exist; refusing to republish or force an existing release." >&2
              exit 1
              ;;
          esac

      - name: Record Node and npm versions for trusted publishing
        if: ${{ steps.registry_preflight.outputs.publish_core == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Publish core
        if: ${{ steps.registry_preflight.outputs.publish_core == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm publish "${{ steps.publish_artifacts.outputs.core_tarball }}" --access public --provenance

      - name: Verify core on the registry before the adapter
        if: ${{ success() && steps.registry_preflight.outputs.publish_adapter == 'true' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
        shell: bash
        run: |
          set -euo pipefail
          verification_file="$RUNNER_TEMP/core-registry-verification"
          verification_error_file="$RUNNER_TEMP/core-registry-verification.err"
          rm -f "$verification_file" "$verification_error_file"
          max_attempts=40
          retry_delay=15
          core_visible=false
          for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
            if npm view "$CORE_PKG_NAME@$CORE_VERSION" name version repository --prefer-online --json > "$verification_file" 2> "$verification_error_file"; then
              core_visible=true
              break
            fi
            if (( attempt < max_attempts )); then
              echo "Waiting for $CORE_PKG_NAME@$CORE_VERSION on the public registry (attempt $attempt/$max_attempts); retrying in ${retry_delay}s."
              sleep "$retry_delay"
            fi
          done
          if [[ "$core_visible" != true ]]; then
            echo "Core registry verification failed; the adapter will not be published. The version did not become visible on the public registry within the wait window." >&2
            cat "$verification_error_file" >&2
            exit 1
          fi
          python3 - "$verification_file" "$CORE_VERSION" "$CORE_PKG_NAME" <<'PY'
          import json
          import sys

          expected_package_name = sys.argv[3]
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          if isinstance(data, list):
              if len(data) != 1:
                  raise SystemExit("Core registry verification returned an unexpected list.")
              data = data[0]
          if not isinstance(data, dict):
              raise SystemExit("Core registry verification returned no manifest object.")
          if data.get("name") != expected_package_name:
              raise SystemExit("Core registry verification returned an unexpected package name.")
          if data.get("version") != sys.argv[2]:
              raise SystemExit("Core registry verification returned an unexpected version.")
          repository_text = json.dumps(data.get("repository"), sort_keys=True)
          if "j1nn0/agent-primitives" not in repository_text:
              raise SystemExit("Core registry verification returned an unexpected repository.")
          print("Core registry verification passed.")
          PY

      - name: Verify core provenance attestation before the adapter
        if: ${{ success() && steps.registry_preflight.outputs.publish_adapter == 'true' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          attestation_url="https://registry.npmjs.org/-/npm/v1/attestations/${CORE_PKG_NAME/\//%2F}@$CORE_VERSION"
          attestation_file="$RUNNER_TEMP/core-provenance-attestation"
          rm -f "$attestation_file"
          max_attempts=40
          retry_delay=15
          core_attestation_visible=false
          core_attestation_status=""
          for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
            core_attestation_status="$(
              curl --silent --show-error --location \
                --output "$attestation_file" \
                --write-out '%{http_code}' \
                "$attestation_url" 2>/dev/null || true
            )"
            if [[ "$core_attestation_status" == "200" ]] && python3 - "$attestation_file" <<'PY'
          import base64
          import json
          import os
          import sys

          required = {
              "https://github.com/npm/attestation/tree/main/specs/publish/v0.1",
              "https://slsa.dev/provenance/v1",
          }
          with open(sys.argv[1], encoding="utf-8") as handle:
              body = json.load(handle)
          attestations = body.get("attestations") if isinstance(body, dict) else None
          if not isinstance(attestations, list):
              raise SystemExit("attestation response has no attestations list")

          predicate_types = set()

          def collect(value):
              if isinstance(value, dict):
                  for key, nested in value.items():
                      if key == "predicateType" and isinstance(nested, str):
                          predicate_types.add(nested)
                      elif key == "predicateTypes" and isinstance(nested, list):
                          predicate_types.update(item for item in nested if isinstance(item, str))
                      collect(nested)
              elif isinstance(value, list):
                  for nested in value:
                      collect(nested)

          for attestation in attestations:
              collect(attestation)
          missing = required - predicate_types
          if missing:
              raise SystemExit(f"attestation response is missing predicate types: {sorted(missing)}")

          slsa_statement = None
          for attestation in attestations:
              if not isinstance(attestation, dict):
                  continue
              bundle = attestation.get("bundle")
              if not isinstance(bundle, dict):
                  continue
              dsse_envelope = bundle.get("dsseEnvelope")
              if not isinstance(dsse_envelope, dict):
                  continue
              payload = dsse_envelope.get("payload")
              if not isinstance(payload, str):
                  continue
              try:
                  decoded_payload = base64.b64decode(payload, validate=True)
                  statement = json.loads(decoded_payload)
              except (ValueError, UnicodeDecodeError):
                  continue
              if (
                  isinstance(statement, dict)
                  and statement.get("predicateType") == "https://slsa.dev/provenance/v1"
                  and isinstance(statement.get("predicate"), dict)
              ):
                  slsa_statement = statement
                  break
          if slsa_statement is None:
              raise SystemExit("attestation response has no decodable SLSA v1 statement with a dict predicate")
          predicate = slsa_statement["predicate"]
          build_definition = predicate.get("buildDefinition")
          if not isinstance(build_definition, dict):
              build_definition = {}
          external_parameters = build_definition.get("externalParameters")
          if not isinstance(external_parameters, dict):
              external_parameters = {}
          workflow = external_parameters.get("workflow")
          if not isinstance(workflow, dict):
              workflow = {}
          resolved_dependencies = build_definition.get("resolvedDependencies")
          first_dependency = resolved_dependencies[0] if isinstance(resolved_dependencies, list) and resolved_dependencies else {}
          digest = first_dependency.get("digest") if isinstance(first_dependency, dict) else {}
          if not isinstance(digest, dict):
              digest = {}

          expected_commit = os.environ.get("RELEASE_COMMIT")
          if not expected_commit:
              raise SystemExit(
                  "buildDefinition.resolvedDependencies[0].digest.gitCommit mismatch: "
                  "expected the RELEASE_COMMIT environment value, actual environment value is missing"
              )
          expected_identity = {
              "buildDefinition.externalParameters.workflow.repository": "https://github.com/j1nn0/agent-primitives",
              "buildDefinition.externalParameters.workflow.path": ".github/workflows/release.yml",
              "buildDefinition.externalParameters.workflow.ref": "refs/heads/main",
              "buildDefinition.resolvedDependencies[0].digest.gitCommit": expected_commit,
          }
          actual_identity = {
              "buildDefinition.externalParameters.workflow.repository": workflow.get("repository"),
              "buildDefinition.externalParameters.workflow.path": workflow.get("path"),
              "buildDefinition.externalParameters.workflow.ref": workflow.get("ref"),
              "buildDefinition.resolvedDependencies[0].digest.gitCommit": digest.get("gitCommit"),
          }
          for field, expected_value in expected_identity.items():
              actual_value = actual_identity[field]
              if actual_value != expected_value:
                  raise SystemExit(
                      f"{field} mismatch: expected {expected_value!r}, actual {actual_value!r}"
                  )
          PY
            then
              core_attestation_visible=true
              break
            fi
            if (( attempt < max_attempts )); then
              echo "Waiting for the core provenance attestation (attempt $attempt/$max_attempts); retrying in ${retry_delay}s."
              sleep "$retry_delay"
            fi
          done
          if [[ "$core_attestation_visible" != true ]]; then
            echo "Core provenance attestation did not appear for $CORE_PKG_NAME@$CORE_VERSION; the adapter will not be published." >&2
            echo "Last attestation HTTP status: ${core_attestation_status:-unknown}." >&2
            exit 1
          fi
          echo "Core provenance attestation verified for $CORE_PKG_NAME@$CORE_VERSION."

      - name: Publish Pi adapter
        if: ${{ success() && steps.registry_preflight.outputs.publish_adapter == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm publish "${{ steps.publish_artifacts.outputs.pi_tarball }}" --access public --provenance

      - name: Verify Pi adapter on the registry
        if: ${{ success() && steps.registry_preflight.outputs.publish_adapter == 'true' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          PI_VERSION: ${{ inputs.pi_version }}
        shell: bash
        run: |
          set -euo pipefail
          verification_file="$RUNNER_TEMP/pi-registry-verification"
          verification_error_file="$RUNNER_TEMP/pi-registry-verification.err"
          rm -f "$verification_file" "$verification_error_file"
          max_attempts=40
          retry_delay=15
          adapter_visible=false
          for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
            if npm view "$ADAPTER_PKG_NAME@$PI_VERSION" name version dependencies --prefer-online --json > "$verification_file" 2> "$verification_error_file"; then
              adapter_visible=true
              break
            fi
            if (( attempt < max_attempts )); then
              echo "Waiting for $ADAPTER_PKG_NAME@$PI_VERSION on the public registry (attempt $attempt/$max_attempts); retrying in ${retry_delay}s."
              sleep "$retry_delay"
            fi
          done
          if [[ "$adapter_visible" != true ]]; then
            echo "Pi adapter registry verification failed. The version did not become visible on the public registry within the wait window." >&2
            cat "$verification_error_file" >&2
            exit 1
          fi
          python3 - "$verification_file" "$PI_VERSION" "$CORE_VERSION" "$ADAPTER_PKG_NAME" "$CORE_PKG_NAME" <<'PY'
          import json
          import sys

          adapter_package_name = sys.argv[4]
          core_package_name = sys.argv[5]
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          if isinstance(data, list):
              if len(data) != 1:
                  raise SystemExit("Pi adapter registry verification returned an unexpected list.")
              data = data[0]
          if not isinstance(data, dict):
              raise SystemExit("Pi adapter registry verification returned no manifest object.")
          if data.get("name") != adapter_package_name:
              raise SystemExit("Pi adapter registry verification returned an unexpected package name.")
          if data.get("version") != sys.argv[2]:
              raise SystemExit("Pi adapter registry verification returned an unexpected version.")
          dependencies = data.get("dependencies")
          expected = f"^{sys.argv[3]}"
          if not isinstance(dependencies, dict) or dependencies.get(core_package_name) != expected:
              raise SystemExit(
                  "Pi adapter registry verification returned an unexpected core dependency."
              )
          print("Pi adapter registry verification passed.")
          PY


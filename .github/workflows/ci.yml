name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The Pi adapter resolves @j1nn0/agent-context-guard through its built
      # dist, so the workspace has to be built before typecheck and test.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - if: matrix.node == '24.x'
        run: pnpm check:package
      - if: matrix.node == '24.x'
        run: pnpm example
      - if: matrix.node == '24.x'
        run: pnpm check:release

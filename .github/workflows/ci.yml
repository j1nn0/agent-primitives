name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The Pi adapter resolves @j1nn0/agent-context-guard through its built
      # dist, so the workspace has to be built before typecheck and test.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - if: matrix.node == '24.x'
        run: pnpm check:package
      - if: matrix.node == '24.x'
        run: pnpm example
      - if: matrix.node == '24.x'
        run: pnpm check:release
      - if: matrix.node == '24.x'
        run: pnpm test:release-guard
      - if: matrix.node == '24.x'
        run: pnpm test:registry-poll
